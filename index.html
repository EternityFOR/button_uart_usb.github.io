<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产品成本统筹器</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #fff;
      --soft: #f8fafc;
      --line: #d9e1ea;
      --line-dark: #b6c2cf;
      --text: #17212b;
      --muted: #647384;
      --accent: #155eef;
      --accent-soft: #eaf1ff;
      --danger: #c93127;
      --good: #0f7a4f;
      --amber: #a86600;
      --amber-soft: #fff6df;
      --danger-soft: #fff0ed;
      --good-soft: #eaf8f1;
      --cost-soft: #eef5ff;
      --shadow: 0 8px 20px rgba(23, 33, 43, .06);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    button, input, select {
      font: inherit;
    }

    button {
      min-height: 32px;
      border: 1px solid var(--line-dark);
      border-radius: 6px;
      padding: 0 10px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.danger {
      border-color: #efb3ad;
      color: var(--danger);
    }

    input, select, textarea {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 8px;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 360px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
    }

    input[type="checkbox"] {
      width: 16px;
      min-height: 16px;
      padding: 0;
    }

    .topbar {
      display: grid;
      gap: 14px;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .header-primary {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      min-width: 0;
    }

    .app-title {
      min-width: 260px;
    }

    .eyebrow {
      display: block;
      margin-bottom: 4px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .app-title p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .project-name {
      max-width: none;
    }

    .product-switcher {
      display: grid;
      grid-template-columns: 72px minmax(180px, 320px) minmax(260px, 1fr) auto;
      gap: 8px;
      align-items: center;
      max-width: 1100px;
    }

    .product-switcher label {
      color: var(--muted);
      font-size: 12px;
    }

    .product-actions,
    .command-group,
    .editor-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .product-actions button,
    .editor-actions button {
      flex: 0 0 auto;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .command-bar {
      align-items: flex-start;
      max-width: 930px;
    }

    .command-group {
      padding-right: 8px;
      border-right: 1px solid var(--line);
    }

    .command-group:last-of-type {
      padding-right: 0;
      border-right: 0;
    }

    .unlock-strip {
      display: grid;
      grid-template-columns: 120px minmax(180px, 280px) minmax(220px, 1fr) auto auto auto minmax(160px, 280px);
      gap: 10px;
      align-items: center;
      padding: 12px 22px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    .unlock-title {
      display: grid;
      gap: 2px;
      min-width: 0;
      font-size: 13px;
      font-weight: 700;
    }

    .unlock-title span,
    .unlock-status {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .remember-unlock {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .remember-unlock input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .planner-page {
      display: grid;
      gap: 14px;
      padding: 16px 22px 24px;
    }

    .summary {
      min-width: 0;
    }

    .assumptions-panel,
    .editor-toolbar,
    .sidebar,
    .category {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .cost-overview {
      display: grid;
      grid-template-columns: repeat(4, minmax(230px, 1fr));
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .overview-metric {
      min-width: 0;
      min-height: 72px;
      display: grid;
      align-content: center;
      gap: 3px;
      padding: 8px 12px;
      border-left: 1px solid var(--line);
    }

    .overview-metric:first-child {
      border-left: 4px solid var(--accent);
    }

    .overview-metric.primary {
      background: var(--cost-soft);
    }

    .overview-metric.warning {
      background: var(--amber-soft);
    }

    .overview-metric.price-formula {
      background: var(--good-soft);
    }

    .overview-metric.price-formula .overview-value {
      color: var(--good);
    }

    .overview-label {
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .overview-value {
      overflow: hidden;
      font-size: 17px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .overview-metric.primary .overview-value {
      font-size: 23px;
    }

    .overview-detail {
      overflow: hidden;
      color: var(--muted-2);
      font-size: 10px;
      font-weight: 600;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .locked-summary {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .workspace {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      min-width: 0;
    }

    .sidebar {
      position: sticky;
      top: 16px;
      padding: 12px;
    }

    .sidebar h2 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    .nav-list {
      display: grid;
      gap: 6px;
    }

    .nav-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--soft);
      color: var(--text);
      text-decoration: none;
    }

    .nav-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .nav-price {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .main {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      min-width: 0;
    }

    #categories,
    .category-body,
    .group-body,
    .item-body {
      min-width: 0;
      max-width: 100%;
    }

    #categories {
      display: grid;
      gap: 10px;
    }

    .assumptions-panel {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 12px;
      align-items: end;
      padding: 10px 12px;
    }

    .parameters-title {
      display: grid;
      gap: 2px;
      align-self: center;
    }

    .parameters-title strong {
      font-size: 13px;
    }

    .parameters-title span {
      color: var(--muted);
      font-size: 11px;
    }

    .assumption-grid {
      display: grid;
      grid-template-columns: minmax(105px, .72fr) minmax(115px, .72fr) minmax(150px, 1fr) minmax(150px, 1fr) minmax(170px, 1.15fr);
      gap: 8px;
      align-items: end;
    }

    .editor-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, .8fr) minmax(360px, 1.6fr) auto;
      gap: 10px;
      align-items: end;
      padding: 12px;
    }

    .editor-actions {
      justify-content: flex-end;
    }

    .field label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .field {
      min-width: 0;
    }

    .category {
      position: relative;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-left: 4px solid #2d7fd3;
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .category.scope-post-sale {
      border-left-color: #8a5fc7;
    }

    .category.scope-fixed-launch {
      border-left-color: #b7791f;
    }

    .category.scope-channel-deduction {
      border-left-color: #0f766e;
    }

    .category.scope-budget-context {
      border-left-color: #64748b;
    }

    .category-header,
    .group-header,
    .item-header {
      width: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .category-header {
      min-height: 46px;
      padding: 10px 12px;
      background: #edf3fa;
      border-bottom: 1px solid var(--line);
    }

    .category:not(.collapsed) > .category-header {
      background: #dfeeff;
    }

    .category.scope-post-sale > .category-header {
      background: #f3effb;
    }

    .category.scope-post-sale:not(.collapsed) > .category-header {
      background: #e9e0f8;
    }

    .category.scope-fixed-launch > .category-header {
      background: #fff8e8;
    }

    .category.scope-fixed-launch:not(.collapsed) > .category-header {
      background: #ffedbd;
    }

    .category.scope-channel-deduction > .category-header {
      background: #edf9f6;
    }

    .category.scope-channel-deduction:not(.collapsed) > .category-header {
      background: #d7f1e9;
    }

    .category.scope-budget-context > .category-header {
      background: #f3f4f6;
    }

    .category.scope-budget-context:not(.collapsed) > .category-header {
      background: #e5e7eb;
    }

    .category.collapsed > .category-header {
      border-bottom: 0;
    }

    .category-body {
      position: relative;
      padding: 6px 8px 9px 24px;
      background: #f7f9fc;
    }

    .category-body::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 12px;
      left: 15px;
      border-left: 2px solid #bfd0e1;
    }

    .group {
      position: relative;
      margin: 6px 0;
      border: 1px solid #cedae6;
      border-radius: 7px;
      background: #fff;
    }

    .group::before {
      content: "";
      position: absolute;
      top: 20px;
      left: -10px;
      width: 10px;
      border-top: 2px solid #bfd0e1;
    }

    .group-header {
      min-height: 40px;
      padding: 7px 10px;
      border-radius: 6px 6px 0 0;
      background: #f2f6f9;
      border-bottom: 1px solid #d8e1ea;
    }

    .group:not(.collapsed) > .group-header {
      background: #eef8f3;
      box-shadow: inset 3px 0 0 #28a167;
    }

    .group.collapsed > .group-header {
      border-bottom: 0;
      border-radius: 6px;
    }

    .group-body {
      position: relative;
      padding: 5px 7px 7px 24px;
      background: #fbfcfd;
    }

    .group-body::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 11px;
      left: 15px;
      border-left: 2px solid #d4dde6;
    }

    .item {
      position: relative;
      margin: 5px 0;
      border: 1px solid #dce4ec;
      border-left: 3px solid #d99400;
      border-radius: 6px;
      background: #fff;
    }

    .item::before {
      content: "";
      position: absolute;
      top: 18px;
      left: -11px;
      width: 9px;
      border-top: 2px solid #d4dde6;
    }

    .item-header {
      min-height: 36px;
      padding: 6px 9px;
      border-radius: 5px 5px 0 0;
      background: #fff;
    }

    .item:not(.collapsed) > .item-header {
      background: #fff7e5;
    }

    .item.collapsed > .item-header {
      border-radius: 5px;
    }

    .header-toggle {
      width: 100%;
      min-width: 0;
      min-height: 30px;
      display: grid;
      gap: 10px;
      align-items: center;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .header-toggle:hover {
      border-color: transparent;
      color: inherit;
    }

    .header-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .category-toggle {
      grid-template-columns: 28px minmax(180px, 1fr) auto auto auto;
    }

    .group-toggle {
      grid-template-columns: 28px minmax(180px, 1fr) auto;
    }

    .item-toggle {
      grid-template-columns: 28px minmax(220px, 1.4fr) minmax(90px, .48fr) minmax(120px, .62fr) minmax(120px, .62fr);
    }

    .twisty {
      width: 22px;
      height: 22px;
      border: 1px solid var(--line-dark);
      border-radius: 5px;
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .category:not(.collapsed) > .category-header .twisty,
    .group:not(.collapsed) > .group-header .twisty,
    .item:not(.collapsed) > .item-header .twisty {
      border-color: currentColor;
      background: #fff;
      color: var(--accent);
    }

    .category.collapsed .category-body,
    .group.collapsed .group-body,
    .item.collapsed .item-body {
      display: none;
    }

    .category.collapsed > .category-header .twisty::before,
    .group.collapsed > .group-header .twisty::before,
    .item.collapsed > .item-header .twisty::before {
      content: "›";
      font-size: 17px;
      line-height: 1;
    }

    .category:not(.collapsed) > .category-header .twisty::before,
    .group:not(.collapsed) > .group-header .twisty::before,
    .item:not(.collapsed) > .item-header .twisty::before {
      content: "⌄";
      font-size: 15px;
      line-height: 1;
    }

    .heading-main {
      min-width: 0;
      display: grid;
      grid-template-columns: 43px minmax(0, 1fr);
      grid-template-rows: auto auto;
      column-gap: 8px;
      align-items: center;
    }

    .heading-main::before {
      grid-row: 1 / 3;
      min-height: 20px;
      display: inline-grid;
      place-items: center;
      align-self: center;
      border: 1px solid var(--line-dark);
      border-radius: 4px;
      background: #fff;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
    }

    .category-header > .category-toggle .heading-main::before {
      content: "大类";
      border-color: #9cbfe5;
      color: #195b9e;
    }

    .group-header > .group-toggle .heading-main::before {
      content: "子类";
      border-color: #9dcfb5;
      color: #167047;
    }

    .item-header > .item-toggle .heading-main::before {
      content: "成本项";
      border-color: #e2c071;
      color: #8a5700;
    }

    .item.channel-reference .heading-main::before {
      content: "扣减项";
      border-color: #7bc8ba;
      color: #0f766e;
    }

    .item.budget-reference .heading-main::before {
      content: "预算项";
      border-color: #aeb8c5;
      color: #526171;
    }

    .heading-main strong {
      grid-column: 2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .heading-main small {
      grid-column: 2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
    }

    .category-header .heading-main strong {
      font-size: 15px;
    }

    .item-header .heading-main strong {
      font-size: 13px;
    }

    .pill {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #0f4ed2;
      font-size: 12px;
      white-space: nowrap;
    }

    .money {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .category-tools,
    .group-tools,
    .item-tools {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
    }

    .item-row-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .item-cell {
      min-width: 0;
    }

    .item-cell strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .item-body {
      padding: 10px;
      border-top: 1px solid #eadfbd;
      border-radius: 0 0 5px 5px;
      background: #fffdf8;
    }

    .item.reference-item .item-body {
      border-top-color: var(--line);
      background: #f8fafc;
    }

    .reference-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
    }

    .reference-field {
      min-width: 0;
      display: grid;
      gap: 3px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    .reference-field span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .reference-field strong {
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.45;
    }

    .reference-field.wide {
      grid-column: 1 / -1;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .suppliers {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      border: 1px solid #ccd8e4;
      border-radius: 6px;
      background: #fff;
    }

    .supplier-head,
    .supplier-row {
      display: grid;
      grid-template-columns: 42px minmax(130px, 1fr) minmax(150px, 1.15fr) minmax(110px, .8fr) 110px 110px 96px 80px 104px 72px;
      gap: 8px;
      align-items: center;
      padding: 8px;
      min-width: 1060px;
    }

    .supplier-head {
      border-bottom: 1px solid var(--line);
      background: #eaf0f6;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .supplier-row {
      border-bottom: 1px solid #edf1f5;
    }

    .supplier-row:last-child {
      border-bottom: 0;
    }

    .chosen {
      color: var(--good);
      font-weight: 700;
    }

    .empty {
      padding: 24px;
      border: 1px dashed var(--line-dark);
      border-radius: 8px;
      background: var(--panel);
      text-align: center;
      color: var(--muted);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 28px;
      background: rgba(12, 20, 28, .45);
    }

    .modal.open {
      display: grid;
    }

    .modal-card {
      width: min(860px, 100%);
      max-height: min(760px, 92vh);
      overflow: auto;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .22);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .footer-note {
      padding-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .cloud-status {
      margin: 8px 0 0;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .cloud-status.ready {
      border-color: #a8d8c0;
      background: #eefaf4;
      color: var(--good);
    }

    .sync-form {
      display: grid;
      gap: 12px;
    }

    .sync-form .field {
      display: grid;
      gap: 4px;
    }

    .history-card {
      width: min(680px, 100%);
    }

    .history-list {
      max-height: 58vh;
      overflow: auto;
      display: grid;
      gap: 8px;
      padding-right: 4px;
    }

    .history-row {
      display: grid;
      grid-template-columns: 74px 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }

    .history-version {
      font-weight: 800;
      color: var(--accent);
    }

    .history-main {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .history-project {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }

    .history-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .history-size {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    @media (max-width: 1280px) {
      .assumption-grid {
        grid-template-columns: repeat(3, minmax(150px, 1fr));
      }

      .editor-toolbar {
        grid-template-columns: minmax(180px, .75fr) minmax(260px, 1.25fr) auto;
      }

      .workspace {
        grid-template-columns: 220px minmax(0, 1fr);
      }

      .item-toggle {
        grid-template-columns: 28px minmax(190px, 1.3fr) minmax(80px, .45fr) minmax(105px, .55fr) minmax(110px, .58fr);
      }
    }

    @media (max-width: 1080px) {
      .header-primary {
        display: grid;
      }

      .command-bar {
        justify-content: flex-start;
        max-width: none;
      }

      .product-switcher {
        grid-template-columns: 72px minmax(0, 1fr);
        max-width: none;
      }

      .product-switcher .project-name,
      .product-switcher .product-actions {
        grid-column: 2;
      }

      .unlock-strip {
        grid-template-columns: 110px minmax(180px, 1fr) auto auto auto;
      }

      .unlock-strip #productAccessCode,
      .unlock-status {
        grid-column: 2 / -1;
      }

      .workspace {
        grid-template-columns: minmax(0, 1fr);
      }

      .sidebar {
        position: static;
      }

      .nav-list {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 3px;
      }

      .nav-item {
        flex: 0 0 min(240px, 72vw);
      }

      .assumptions-panel {
        grid-template-columns: 1fr;
      }

      .parameters-title {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .assumption-grid {
        grid-template-columns: repeat(3, minmax(140px, 1fr));
      }

      .editor-toolbar {
        grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr);
      }

      .editor-actions {
        grid-column: 1 / -1;
        justify-content: flex-start;
      }
    }

    @media (max-width: 900px) {
      .cost-overview {
        display: flex;
        overflow-x: auto;
      }

      .overview-metric {
        flex: 0 0 250px;
      }

      .overview-metric.primary {
        flex-basis: 270px;
      }
    }

    @media (max-width: 720px) {
      .topbar,
      .planner-page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .app-title {
        min-width: 0;
      }

      h1 {
        font-size: 21px;
      }

      .command-bar,
      .command-group {
        justify-content: flex-start;
      }

      .command-bar {
        width: 100%;
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 3px;
      }

      .command-group {
        width: auto;
        flex: 0 0 auto;
        flex-wrap: nowrap;
        padding-right: 8px;
        padding-bottom: 0;
        border-right: 1px solid var(--line);
        border-bottom: 0;
      }

      .command-bar > button {
        flex: 0 0 auto;
      }

      .product-switcher {
        grid-template-columns: 1fr;
      }

      .product-switcher .project-name,
      .product-switcher .product-actions {
        grid-column: auto;
      }

      .product-actions,
      .editor-actions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: 100%;
      }

      .product-actions button,
      .editor-actions button {
        min-width: 0;
        padding-left: 6px;
        padding-right: 6px;
      }

      .unlock-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        padding-left: 14px;
        padding-right: 14px;
      }

      .unlock-title,
      .unlock-strip select,
      .unlock-strip #productAccessCode,
      .unlock-status {
        grid-column: 1 / -1;
      }

      .remember-unlock {
        grid-column: 1 / -1;
      }

      .cost-overview {
        display: flex;
        overflow-x: auto;
      }

      .overview-metric {
        flex: 0 0 230px;
      }

      .overview-metric.primary {
        flex-basis: 250px;
      }

      .assumption-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .assumption-grid .field:last-child {
        grid-column: 1 / -1;
      }

      .editor-toolbar {
        grid-template-columns: 1fr;
      }

      .editor-actions {
        grid-column: auto;
      }

      .locked-summary {
        grid-template-columns: 1fr;
      }

      .category-header,
      .group-header,
      .item-header {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .category-tools,
      .group-tools,
      .item-tools {
        justify-content: flex-start;
      }

      .category-toggle {
        grid-template-columns: 28px minmax(0, 1fr);
      }

      .category-toggle .pill {
        display: none;
      }

      .group-toggle {
        grid-template-columns: 28px minmax(0, 1fr);
      }

      .item-toggle {
        grid-template-columns: 28px minmax(0, 1fr);
      }

      .item-toggle .summary-qty,
      .item-toggle .summary-supplier {
        display: none;
      }

      .heading-main {
        align-items: start;
      }

      .heading-main strong,
      .heading-main small,
      .item-toggle .summary-cost strong {
        overflow: visible;
        text-overflow: clip;
        white-space: normal;
        overflow-wrap: anywhere;
        line-height: 1.35;
      }

      .category-toggle > .money,
      .group-toggle > .money,
      .item-toggle .summary-cost {
        grid-column: 2;
        justify-self: start;
        min-width: 0;
        margin-top: 2px;
        text-align: left;
      }

      .item-toggle .summary-cost {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }

      .item-toggle .summary-cost .item-row-label {
        flex: 0 0 auto;
        margin: 0;
      }

      .detail-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .category-body {
        padding-left: 19px;
      }

      .category-body::before {
        left: 11px;
      }

      .group-body {
        padding-left: 19px;
      }

      .group-body::before {
        left: 11px;
      }

      .modal {
        padding: 12px;
      }
    }

    @media (max-width: 480px) {
      .detail-grid {
        grid-template-columns: 1fr;
      }

      .assumption-grid .field:last-child {
        grid-column: 1 / -1;
      }

      .product-actions button,
      .editor-actions button {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="header-primary">
      <div class="app-title">
        <span class="eyebrow">DeDge Cost Planner</span>
        <h1>产品成本统筹器</h1>
        <p>汇总并分类产品的单位成本、批次成本与供应商报价。</p>
      </div>
      <div class="actions command-bar">
        <div class="command-group" aria-label="数据操作">
          <button id="exportCsvBtn">导出 CSV</button>
          <button id="exportJsonBtn">导出 JSON</button>
          <button id="importJsonBtn">导入 JSON</button>
        </div>
        <div class="command-group" aria-label="云端操作">
          <button class="primary" id="saveCloudBtn">保存云端</button>
          <button id="loadCloudBtn">读取云端</button>
          <button id="cloudHistoryBtn">云端历史</button>
          <button id="cloudConfigBtn">云端设置</button>
        </div>
        <button class="danger" id="resetBtn">清空当前</button>
      </div>
    </div>
    <div class="product-switcher">
      <label for="productSelect">当前产品</label>
      <select id="productSelect"></select>
      <input class="project-name" id="projectName" aria-label="产品名称" placeholder="产品名称">
      <div class="product-actions" aria-label="产品操作">
        <button id="addProductBtn">新增产品</button>
        <button id="duplicateProductBtn">复制产品</button>
        <button class="danger" id="deleteProductBtn">删除产品</button>
      </div>
    </div>
  </header>

  <section class="unlock-strip">
    <div class="unlock-title">产品解锁</div>
    <select id="vaultProductSelect" aria-label="选择要解锁的产品"></select>
    <input id="productAccessCode" type="password" autocomplete="off" placeholder="输入访问码">
    <label class="remember-unlock" title="仅保存在当前浏览器；清除解锁会同时删除">
      <input id="rememberUnlock" type="checkbox" checked>
      <span>记住本机</span>
    </label>
    <button class="primary" id="unlockProductBtn">解锁产品</button>
    <button id="lockSessionBtn">清除解锁</button>
    <div class="unlock-status" id="unlockStatus">正在加载密文包...</div>
  </section>

  <main class="planner-page">
    <section class="summary" id="summary"></section>

    <section class="assumptions-panel">
      <div class="parameters-title">
        <strong>计算参数</strong>
        <span>成本与价格</span>
      </div>
      <div class="assumption-grid">
        <div class="field">
          <label for="batchQty">批次数量</label>
          <input id="batchQty" type="number" min="1" step="1">
        </div>
        <div class="field">
          <label for="currency">币种</label>
          <select id="currency">
            <option value="¥">CNY 人民币</option>
            <option value="HK$">HKD 港币</option>
            <option value="$">USD 美元</option>
          </select>
        </div>
        <div class="field">
          <label for="targetProjectProfitMargin">目标首发项目利润率 %</label>
          <input id="targetProjectProfitMargin" type="number" min="0" max="60" step="1">
        </div>
        <div class="field">
          <label for="salesFeeRate">销售渠道扣减率 %</label>
          <input id="salesFeeRate" type="number" min="0" max="30" step="0.5">
        </div>
        <div class="field">
          <label for="fixedLaunchCost" id="fixedLaunchCostLabel">首发固定投入</label>
          <input id="fixedLaunchCost" type="number" min="0" step="1">
        </div>
      </div>
    </section>

    <div class="workspace">
      <aside class="sidebar">
        <h2>成本分类</h2>
        <div class="nav-list" id="categoryNav"></div>
        <p class="footer-note">当前会话数据</p>
        <p class="cloud-status" id="cloudStatus">云端未配置</p>
      </aside>

      <section class="main">
        <div class="editor-toolbar">
          <div class="field search-field">
          <label for="filterText">搜索物料/供应商</label>
          <input id="filterText" placeholder="如 物料、供应商、规格">
          </div>
          <div class="field note-field">
          <label for="globalNote">项目备注</label>
          <input id="globalNote" placeholder="版本、样机、量产、采购批次">
          </div>
          <div class="editor-actions" aria-label="成本明细操作">
            <button id="expandAllBtn">全部展开</button>
            <button id="collapseAllBtn">全部折叠</button>
            <button class="primary" id="addCategoryBtn">新增大类</button>
          </div>
        </div>

        <div id="categories"></div>
      </section>
    </div>
  </main>

  <div class="modal" id="jsonModal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">JSON</h2>
        <div class="actions">
          <button id="copyJsonBtn">复制</button>
          <button class="primary" id="applyJsonBtn">应用导入</button>
          <button id="closeModalBtn">关闭</button>
        </div>
      </div>
      <textarea id="jsonText"></textarea>
      <p class="footer-note">导入会覆盖当前浏览器里的表格数据，建议先导出备份。</p>
    </div>
  </div>

  <div class="modal" id="cloudModal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2>云端同步设置</h2>
        <div class="actions">
          <button class="primary" id="saveCloudConfigBtn">保存设置</button>
          <button id="closeCloudModalBtn">关闭</button>
        </div>
      </div>
      <div class="sync-form">
        <div class="field">
          <label for="cloudEndpoint">Worker地址</label>
          <input id="cloudEndpoint" placeholder="https://你的-worker.workers.dev">
        </div>
        <div class="field">
          <label for="cloudDocKey">数据Key</label>
          <input id="cloudDocKey" placeholder="product-cost">
        </div>
        <div class="field">
          <label for="cloudUser">你的名字</label>
          <input id="cloudUser" placeholder="如 William / 采购A">
        </div>
        <div class="field">
          <label for="cloudSecret">同步密钥</label>
          <input id="cloudSecret" type="password" placeholder="只发给需要同步成本表的人">
        </div>
      </div>
      <p class="footer-note">填写同步接口地址、数据Key、名称和同步密钥。</p>
    </div>
  </div>

  <div class="modal" id="historyModal" role="dialog" aria-modal="true">
    <div class="modal-card history-card">
      <div class="modal-head">
        <h2>云端历史记录</h2>
        <div class="actions">
          <button id="refreshHistoryBtn">刷新</button>
          <button id="closeHistoryModalBtn">关闭</button>
        </div>
      </div>
      <div class="history-list" id="historyList"></div>
      <p class="footer-note">记录来自 Cloudflare Worker；旧 Worker 需要更新后，新的保存才会追加历史。</p>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "dedge-cost-planner-session-v1";
    const LEGACY_STORAGE_KEY = "cost-planner-v1";
    const CLOUD_CONFIG_KEY = "cost-planner-cloud-config-v1";
    const UNLOCK_PREFERENCE_KEY = "dedge-cost-planner-unlock-preference-v1";
    const DEFAULT_CLOUD_DOC_KEY = "product-cost";
    const DEFAULT_USER_NAME = "未填写";
    const VAULT_URL = "data/cost-vault.json";
    const COST_SCOPE_PRE_DELIVERY_CASH = "pre-delivery-cash";
    const COST_SCOPE_POST_SALE_SUPPORT = "post-sale-support-reserve";
    const COST_SCOPE_FIXED_LAUNCH = "fixed-launch-investment";
    const COST_SCOPE_CHANNEL_DEDUCTION = "sales-channel-deduction";
    const COST_SCOPE_BUDGET_CONTEXT = "budget-context";
    const FINANCIAL_TERMINOLOGY_VERSION = "2026-07-18-budget-context";

    const blankProductTemplate = {
      projectName: "未命名成本表",
      batchQty: 100,
      currency: "¥",
      targetFirstLaunchProjectProfitMargin: 30,
      salesFeeRate: 0,
      fixedLaunchCost: 0,
      note: "",
      categories: []
    };

    let store = loadStore();
    let data = activeProduct();
    let cloudConfig = loadCloudConfig();
    let costVault = null;
    let filterText = "";
    let localSavedAt = store._cloud?.savedAt || "";

    const el = {
      vaultProductSelect: document.getElementById("vaultProductSelect"),
      productAccessCode: document.getElementById("productAccessCode"),
      rememberUnlock: document.getElementById("rememberUnlock"),
      unlockStatus: document.getElementById("unlockStatus"),
      productSelect: document.getElementById("productSelect"),
      projectName: document.getElementById("projectName"),
      batchQty: document.getElementById("batchQty"),
      currency: document.getElementById("currency"),
      targetProjectProfitMargin: document.getElementById("targetProjectProfitMargin"),
      salesFeeRate: document.getElementById("salesFeeRate"),
      fixedLaunchCost: document.getElementById("fixedLaunchCost"),
      fixedLaunchCostLabel: document.getElementById("fixedLaunchCostLabel"),
      globalNote: document.getElementById("globalNote"),
      summary: document.getElementById("summary"),
      categoryNav: document.getElementById("categoryNav"),
      categories: document.getElementById("categories"),
      filterText: document.getElementById("filterText"),
      jsonModal: document.getElementById("jsonModal"),
      jsonText: document.getElementById("jsonText"),
      modalTitle: document.getElementById("modalTitle"),
      applyJsonBtn: document.getElementById("applyJsonBtn"),
      copyJsonBtn: document.getElementById("copyJsonBtn"),
      cloudStatus: document.getElementById("cloudStatus"),
      cloudModal: document.getElementById("cloudModal"),
      cloudEndpoint: document.getElementById("cloudEndpoint"),
      cloudDocKey: document.getElementById("cloudDocKey"),
      cloudUser: document.getElementById("cloudUser"),
      cloudSecret: document.getElementById("cloudSecret"),
      historyModal: document.getElementById("historyModal"),
      historyList: document.getElementById("historyList")
    };

    bindGlobalEvents();
    render();
    loadVault();

    function uid() {
      return Math.random().toString(36).slice(2, 10);
    }

    function category(name, note, groups, costScope = COST_SCOPE_PRE_DELIVERY_CASH) {
      return { id: uid(), name, note, costScope, collapsed: false, groups };
    }

    function group(name, note, items) {
      return { id: uid(), name, note, collapsed: false, items };
    }

    function item(name, designator, footprint, qty, unit, note, suppliers) {
      return {
        id: uid(),
        name,
        designator,
        footprint,
        qty,
        unit,
        lossRate: 0,
        processCost: 0,
        note,
        chosenSupplierId: "",
        collapsed: true,
        suppliers
      };
    }

    function supplier(name, sku, model, price, shipping, moq, note) {
      return {
        id: uid(),
        name,
        sku,
        model,
        price,
        shipping,
        moq,
        pricingMode: note === "batch" ? "batch" : "unit",
        note
      };
    }

    function loadStore() {
      const raw = sessionStorage.getItem(STORAGE_KEY);
      if (!raw) return createStore([]);
      try {
        return normalizeStore(JSON.parse(raw));
      } catch {
        return createStore([]);
      }
    }

    function createStore(products = []) {
      const normalizedProducts = products.map((product) => normalizeData(product));
      normalizedProducts.forEach((product) => product.id ||= uid());
      return {
        version: 2,
        activeProductId: normalizedProducts[0]?.id || "",
        products: normalizedProducts
      };
    }

    function normalizeStore(value) {
      if (Array.isArray(value?.products)) {
        const next = {
          version: 2,
          activeProductId: value.activeProductId || "",
          products: value.products.map((product) => normalizeData(product)),
          _cloud: value._cloud || null,
          _localUpdatedAt: value._localUpdatedAt || ""
        };
        next.products.forEach((product) => product.id ||= uid());
        if (next.products.length && !next.products.some((product) => product.id === next.activeProductId)) {
          next.activeProductId = next.products[0].id;
        }
        return next;
      }
      return value?.categories ? createStore([value]) : createStore([]);
    }

    function normalizeData(value) {
      const next = { ...clone(blankProductTemplate), ...value };
      next.id ||= uid();
      next.categories = Array.isArray(value?.categories) ? value.categories : [];
      next.targetFirstLaunchProjectProfitMargin = value?.targetFirstLaunchProjectProfitMargin
        ?? value?.compatibilityAliases?.targetNetMargin
        ?? value?.targetNetMargin
        ?? value?.targetMargin
        ?? 30;
      const compatibilityAliases = { ...(value?.compatibilityAliases || {}) };
      delete compatibilityAliases.targetNetMargin;
      if (Object.keys(compatibilityAliases).length) next.compatibilityAliases = compatibilityAliases;
      else delete next.compatibilityAliases;
      delete next.targetNetMargin;
      delete next.targetMargin;
      next.salesFeeRate = value?.salesFeeRate ?? 0;
      next.fixedLaunchCost = value?.fixedLaunchCost ?? 0;
      delete next.financialSummary;
      next.categories.forEach((cat) => {
        cat.groups ||= [];
        cat.costScope = normalizeCostScope(
          cat.costScope || (cat.id === "support-reserve" ? COST_SCOPE_POST_SALE_SUPPORT : COST_SCOPE_PRE_DELIVERY_CASH)
        );
      });
      walkItems(next, (it) => {
        it.suppliers ||= [];
        if (!it.suppliers.some((sp) => sp.id === it.chosenSupplierId)) it.chosenSupplierId = "";
        it.lossRate = number(it.lossRate);
        it.processCost = number(it.processCost);
        it.qty = number(it.qty);
        it.suppliers.forEach((sp) => {
          sp.pricingMode ||= sp.note === "batch" ? "batch" : "unit";
        });
      });
      return next;
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function activeProduct() {
      return store.products.find((product) => product.id === store.activeProductId) || store.products[0] || clone(blankProductTemplate);
    }

    function setActiveProduct(productId) {
      const product = store.products.find((entry) => entry.id === productId);
      if (!product) return;
      store.activeProductId = product.id;
      data = product;
      filterText = "";
      el.filterText.value = "";
      save();
      render();
    }

    function save() {
      if (store.products.length) syncFixedLaunchCost(data);
      store._localUpdatedAt = new Date().toISOString();
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    }

    function loadCloudConfig() {
      const fallback = { endpoint: "", docKey: DEFAULT_CLOUD_DOC_KEY, userName: "", secret: "" };
      const raw = localStorage.getItem(CLOUD_CONFIG_KEY);
      if (!raw) return fallback;
      try {
        return { ...fallback, ...JSON.parse(raw) };
      } catch {
        return fallback;
      }
    }

    function saveCloudConfig() {
      localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cloudConfig));
    }

    function loadUnlockPreference() {
      const fallback = { remember: true, productId: "", accessCode: "" };
      try {
        const raw = localStorage.getItem(UNLOCK_PREFERENCE_KEY);
        if (!raw) return fallback;
        const value = JSON.parse(raw);
        return {
          remember: value?.remember !== false,
          productId: String(value?.productId || ""),
          accessCode: String(value?.accessCode || "")
        };
      } catch {
        return fallback;
      }
    }

    function restoreUnlockPreference() {
      const preference = loadUnlockPreference();
      const products = Array.isArray(costVault?.products) ? costVault.products : [];
      el.rememberUnlock.checked = preference.remember;
      if (products.some((product) => product.id === preference.productId)) {
        el.vaultProductSelect.value = preference.productId;
      }
      restoreAccessCodeForSelection();
    }

    function restoreAccessCodeForSelection() {
      const preference = loadUnlockPreference();
      el.productAccessCode.value = preference.remember
        && preference.productId === el.vaultProductSelect.value
        ? preference.accessCode
        : "";
    }

    function saveUnlockPreference(productId, accessCode) {
      if (!el.rememberUnlock.checked) {
        localStorage.removeItem(UNLOCK_PREFERENCE_KEY);
        return;
      }

    function bindRootField(node, key, readValue, rebuildDetailsOnInput = false) {
      node.addEventListener("input", () => updateRoot(key, readValue(), rebuildDetailsOnInput));
      node.addEventListener("blur", () => updateRoot(key, readValue(), !rebuildDetailsOnInput));
    }

    function updateRoot(key, value, rebuildDetails = false, refreshOverview = true) {
      if (!store.products.length) return;
      data[key] = value;
      save();
      if (rebuildDetails) {
        if (key === "projectName") renderProductSelect();
        renderCostViews();
      } else if (refreshOverview) {
        renderSummary();
      }
    }

    async function loadVault() {
      setUnlockStatus("正在加载密文包...");
      try {
        const response = await fetch(VAULT_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        costVault = await response.json();
        renderVaultOptions();
        setUnlockStatus(`可解锁产品：${costVault.products?.length || 0} 个`);
      } catch (error) {
        costVault = { products: [] };
        renderVaultOptions();
        setUnlockStatus(`密文包读取失败：${error.message}`);
      }
    }

    function renderVaultOptions() {
      const products = Array.isArray(costVault?.products) ? costVault.products : [];
      el.vaultProductSelect.innerHTML = products.length
        ? products.map((product) => `<option value="${escapeAttr(product.id)}">${escapeHtml(product.label || product.id)}</option>`).join("")
        : `<option value="">暂无可解锁产品</option>`;
      el.vaultProductSelect.disabled = !products.length;
      document.getElementById("unlockProductBtn").disabled = !products.length;
      restoreUnlockPreference();
    }

    async function unlockProduct() {
      if (!costVault) await loadVault();
      const productId = el.vaultProductSelect.value;
      const entry = costVault?.products?.find((product) => product.id === productId);
      const accessCode = el.productAccessCode.value.trim();
      if (!entry) {
        alert("没有找到可解锁的产品。");
        return;
      }
      if (!accessCode) {
        alert("请先输入访问码。");
        return;
      }

      setUnlockStatus("正在解锁...");
      try {
        const product = normalizeData(await decryptVaultProduct(entry, accessCode));
        product._vault = {
          id: entry.id,
          label: entry.label || "",
          unlockedAt: new Date().toISOString()
        };
        const index = store.products.findIndex((item) => item.id === product.id || item._vault?.id === entry.id);
        if (index >= 0) {
          store.products[index] = product;
        } else {
          store.products.push(product);
        }
        store.activeProductId = product.id;
        data = product;
        saveUnlockPreference(entry.id, accessCode);
        el.productAccessCode.value = el.rememberUnlock.checked ? accessCode : "";
        save();
        render();
        setUnlockStatus(`已解锁：${product.projectName || entry.label || product.id}`);
      } catch {
        setUnlockStatus("解锁失败");
        alert("访问码不匹配，或数据包已损坏。");
      }
    }

    async function decryptVaultProduct(entry, accessCode) {
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(accessCode),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: fromBase64(entry.salt),
          iterations: number(costVault?.kdf?.iterations) || 210000,
          hash: costVault?.kdf?.hash || "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromBase64(entry.iv) },
        key,
        fromBase64(entry.ciphertext)
      );
      return JSON.parse(new TextDecoder().decode(plaintext));
    }

    function fromBase64(value) {
      const binary = atob(value);
      return Uint8Array.from(binary, (char) => char.charCodeAt(0));
    }

    function clearUnlockedProducts() {
      if (store.products.length && !confirm("清除当前浏览器里已解锁的产品数据？")) return;
      sessionStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(LEGACY_STORAGE_KEY);
      clearUnlockPreference();
      store = createStore([]);
      data = activeProduct();
      localSavedAt = "";
      render();
      setUnlockStatus("已清除解锁数据");
    }

      el.unlockStatus.textContent = text;
    }

    function addProduct() {
      const name = prompt("产品名称", `新产品 ${store.products.length + 1}`);
      if (!name) return;
      const product = normalizeData(clone(blankProductTemplate));
      product.id = uid();
      product.projectName = name;
      product.categories.forEach((cat) => cat.collapsed = false);
      store.products.push(product);
      store.activeProductId = product.id;
      data = product;
      save();
      render();
    }

    function duplicateProduct() {
      if (!store.products.length) return;
      const name = prompt("复制后的产品名称", `${data.projectName || "未命名产品"} 副本`);
      if (!name) return;
      const product = normalizeData(clone(data));
      product.id = uid();
      product.projectName = name;
      product._cloud = null;
      product._localUpdatedAt = "";
      store.products.push(product);
      store.activeProductId = product.id;
      data = product;
      save();
      render();
    }

    function deleteProduct() {
      if (!store.products.length) {
        alert("当前没有已解锁产品。");
        return;
      }
      if (!confirm(`删除产品“${data.projectName || "未命名产品"}”？`)) return;
      const deleteId = data.id;
      store.products = store.products.filter((product) => product.id !== deleteId);
      store.activeProductId = store.products[0]?.id || "";
      data = activeProduct();
      save();
      render();
    }

    function openCategoryFromNav(categoryId) {
      const cat = findCategory(categoryId);
      if (!cat) return;
      filterText = "";
      el.filterText.value = "";
      data.categories.forEach((candidate) => {
        const active = candidate.id === categoryId;
        candidate.collapsed = !active;
        candidate.groups.forEach((grp) => {
          grp.collapsed = !active;
          grp.items.forEach((it) => it.collapsed = !active);
        });
      });
      save();
      renderCategories();
      requestAnimationFrame(() => {
        document.getElementById(`cat-${categoryId}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    function renderCategories() {
      if (!store.products.length) {
        el.categories.innerHTML = `<div class="empty">待解锁。</div>`;
        return;
      }
      const html = data.categories.map(renderCategory).filter(Boolean).join("");
      el.categories.innerHTML = html || `<div class="empty">没有匹配的物料。</div>`;
      bindRenderedEvents();
    }

    function renderCategory(cat) {
      const groups = cat.groups.map((grp) => renderGroup(cat, grp)).filter(Boolean);
      if (filterText && !matchesCategory(cat) && !groups.length) return "";
      const scope = normalizeCostScope(cat.costScope);
      const scopeClass = scope === COST_SCOPE_FIXED_LAUNCH
        ? "scope-fixed-launch"
        : scope === COST_SCOPE_POST_SALE_SUPPORT
          ? "scope-post-sale"
          : scope === COST_SCOPE_CHANNEL_DEDUCTION
            ? "scope-channel-deduction"
            : scope === COST_SCOPE_BUDGET_CONTEXT
              ? "scope-budget-context"
              : "scope-pre-delivery";
      const readOnlyScope = isReferenceScope(scope);
      return `
        <article class="category ${scopeClass} ${cat.collapsed ? "collapsed" : ""}" id="cat-${cat.id}">
          <div class="category-header">
            <button type="button" class="header-toggle category-toggle" data-toggle-category="${cat.id}" aria-expanded="${cat.collapsed ? "false" : "true"}">
              <span class="twisty" aria-hidden="true"></span>
              <span class="heading-main"><strong>${escapeHtml(cat.name)}</strong><small>${escapeHtml(cat.note || "")}</small></span>

          <div class="category-body">${groups.join("")}</div>
        </article>
      `;

    function renderGroup(cat, grp) {
      const items = grp.items.map((it) => renderItem(cat, grp, it)).filter(Boolean);

    function renderReferenceItem(cat, grp, it) {
      const reference = it.budgetReference || {};
      const channelItem = isChannelDeductionScope(cat.costScope);
      const modelBoundary = reference.referenceKind === "model-boundary";
      const ratePercent = channelItem ? channelItemRatePercent(cat, it) : 0;
      const referenceId = modelBoundary ? "权威财务模型" : reference.budgetId || it.designator;
      const identity = [referenceId, budgetStatusLabel(reference.status)].filter(Boolean).join(" · ");
      const relationship = channelItem ? "已进入售价公式" : budgetRelationshipLabel(reference.relationship);
      const displayName = budgetItemLabel(reference.budgetId, it.name);
      const estimateLabel = modelBoundary ? "当前金额状态" : "Office 原币区间";
      return `
        <section class="item reference-item ${channelItem ? "channel-reference" : "budget-reference"} ${it.collapsed ? "collapsed" : ""}">
          <div class="item-header">
            <button type="button" class="header-toggle item-toggle" data-toggle-item="${cat.id}:${grp.id}:${it.id}" aria-expanded="${it.collapsed ? "false" : "true"}">

              ${headerCell(budgetEstimateLabel(reference), estimateLabel, "summary-supplier")}
              ${headerCell(channelItem ? `${formatFixed(ratePercent, 2)}%` : relationship, channelItem ? "当前扣减率" : "当前模型", "summary-cost")}
            </button>
          </div>
          <div class="item-body">
            <div class="reference-grid">
              ${referenceField(modelBoundary ? "参考来源" : "预算编号", referenceId || "-")}
              ${referenceField(modelBoundary ? "边界状态" : "预算状态", budgetStatusLabel(reference.status))}
              ${referenceField(modelBoundary ? "当前金额状态" : "原币估算", budgetEstimateLabel(reference))}
              ${referenceField("当前模型关系", relationship)}
              ${referenceField("触发阶段", reference.dueStage || "未填写")}
              ${referenceField("分类", reference.category || "未填写")}
              ${referenceField(modelBoundary ? "权威模型条目" : "Office 原始条目", it.name || "未填写", true)}
              ${referenceField("依据", reference.sourceOrBasis || "未填写", true)}
              ${referenceField("备注", reference.notes || it.note || "未填写", true)}
            </div>
          </div>
        </section>
      `;
    }

    function referenceField(label, value, wide = false) {
      return `<div class="reference-field ${wide ? "wide" : ""}"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`;
    }

    function renderSupplier(cat, grp, it, sp) {
      const checked = it.chosenSupplierId === sp.id;
      return `
        <div class="supplier-row">
          <input type="checkbox" ${checked ? "checked" : ""} data-action="choose-supplier" data-category-id="${cat.id}" data-group-id="${grp.id}" data-item-id="${it.id}" data-supplier-id="${sp.id}" aria-label="选择供应商">
          <input value="${escapeAttr(sp.name)}" data-supplier-field="name" data-category-id="${cat.id}" data-group-id="${grp.id}" data-item-id="${it.id}" data-supplier-id="${sp.id}">
          <input value="${escapeAttr(sp.model)}" data-supplier-field="model" data-category-id="${cat.id}" data-group-id="${grp.id}" data-item-id="${it.id}" data-supplier-id="${sp.id}">
          <input value="${escapeAttr(sp.sku)}" data-supplier-field="sku" data-category-id="${cat.id}" data-group-id="${grp.id}" data-item-id="${it.id}" data-supplier-id="${sp.id}">
          <select data-supplier-field="pricingMode" data-category-id="${cat.id}" data-group-id="${grp.id}" data-item-id="${it.id}" data-supplier-id="${sp.id}">

            <option value="batch" ${sp.pricingMode === "batch" ? "selected" : ""}>批次分摊</option>
          </select>
          <input type="number" min="0" step="0.0001" value="${escapeAttr(sp.price)}" data-supplier-field="price" data-category-id="${cat.id}" data-group-id="${grp.id}" data-item-id="${it.id}" data-supplier-id="${sp.id}">
          <input type="number" min="0" step="0.0001" value="${escapeAttr(sp.shipping)}" data-supplier-field="shipping" data-category-id="${cat.id}" data-group-id="${grp.id}" data-item-id="${it.id}" data-supplier-id="${sp.id}">
          <input type="number" min="0" step="1" value="${escapeAttr(sp.moq)}" data-supplier-field="moq" data-category-id="${cat.id}" data-group-id="${grp.id}" data-item-id="${it.id}" data-supplier-id="${sp.id}">
          <span class="${checked ? "chosen" : ""}">${money(supplierDisplayAmount(cat, it, sp))}</span>

    function headerCell(value, label, className = "") {
      return `<span class="item-cell ${escapeAttr(className)}"><span class="item-row-label">${escapeHtml(label)}</span><strong>${escapeHtml(value ?? "")}</strong></span>`;
    }

    function fieldHtml(label, field, value, catId, grpId, itemId, type = "text") {
      return `<div class="field"><label>${escapeHtml(label)}</label><input type="${type}" value="${escapeAttr(value ?? "")}" data-item-field="${field}" data-category-id="${catId}" data-group-id="${grpId}" data-item-id="${itemId}"></div>`;
    }

    function bindRenderedEvents() {
      document.querySelectorAll("[data-toggle-category]").forEach((node) => {
        node.addEventListener("click", (event) => {
          if (event.target.closest("[data-action]")) return;
          const cat = findCategory(node.dataset.toggleCategory);
          cat.collapsed = !cat.collapsed;
          save();
          renderCategories();
        });
      });
      document.querySelectorAll("[data-toggle-group]").forEach((node) => {
        node.addEventListener("click", (event) => {
          if (event.target.closest("[data-action]")) return;
          const [catId, grpId] = node.dataset.toggleGroup.split(":");
          const grp = findGroup(catId, grpId);
          grp.collapsed = !grp.collapsed;
          save();
          renderCategories();
        });
      });
      document.querySelectorAll("[data-toggle-item]").forEach((node) => {
        node.addEventListener("click", (event) => {
          if (event.target.closest("[data-action]")) return;
          const [catId, grpId, itemId] = node.dataset.toggleItem.split(":");
          const it = findItem(catId, grpId, itemId);
          it.collapsed = !it.collapsed;
          save();
          renderCategories();
        });
      });
      document.querySelectorAll("[data-action]").forEach((node) => node.addEventListener("click", handleAction));
      document.querySelectorAll("[data-item-field]").forEach((node) => {
        node.addEventListener("input", (event) => handleItemField(event, false));
        node.addEventListener("blur", (event) => handleItemField(event, true));
      });
      document.querySelectorAll("[data-supplier-field]").forEach((node) => {
        node.addEventListener("input", (event) => handleSupplierField(event, false));
        node.addEventListener(node.tagName === "SELECT" ? "change" : "blur", (event) => handleSupplierField(event, true));
      });
    }

    function handleAction(event) {
      const action = event.currentTarget.dataset.action;
      if (!action) return;
      event.stopPropagation();
      const d = event.currentTarget.dataset;
      if (action === "add-group") addGroup(d.categoryId);
      if (action === "edit-category") editCategory(d.categoryId);
      if (action === "add-item") addItem(d.categoryId, d.groupId);
      if (action === "edit-group") editGroup(d.categoryId, d.groupId);
      if (action === "edit-item") {
        findItem(d.categoryId, d.groupId, d.itemId).collapsed = false;
        save();
        renderCategories();
      }
      if (action === "add-supplier") addSupplier(d.categoryId, d.groupId, d.itemId);
      if (action === "delete-item") deleteItem(d.categoryId, d.groupId, d.itemId);
      if (action === "delete-supplier") deleteSupplier(d.categoryId, d.groupId, d.itemId, d.supplierId);
      if (action === "choose-supplier") chooseSupplier(d.categoryId, d.groupId, d.itemId, d.supplierId);
    }

    function handleItemField(event, rebuildDetails) {
      const d = event.currentTarget.dataset;
      const it = findItem(d.categoryId, d.groupId, d.itemId);
      it[d.itemField] = event.currentTarget.type === "number" ? number(event.currentTarget.value) : event.currentTarget.value;
      save();
      if (rebuildDetails) renderCostViews();
      else renderSummary();
    }

    function handleSupplierField(event, rebuildDetails) {
      const d = event.currentTarget.dataset;
      const sp = findSupplier(d.categoryId, d.groupId, d.itemId, d.supplierId);
      sp[d.supplierField] = event.currentTarget.type === "number" ? number(event.currentTarget.value) : event.currentTarget.value;
      save();
      if (rebuildDetails) renderCostViews();
      else renderSummary();
    }

    function addCategory() {
      if (!store.products.length) return;
      const name = prompt("大类名称", "新大类");
      if (!name) return;
      data.categories.push(category(name, "", [], COST_SCOPE_PRE_DELIVERY_CASH));
      save();
      render();
    }

    function editCategory(catId) {
      const cat = findCategory(catId);
      const name = prompt("大类名称", cat.name);
      if (!name) return;
      const note = prompt("大类备注", cat.note || "");
      const scope = prompt(
        "成本范围代码：pre-delivery-cash、post-sale-support-reserve 或 fixed-launch-investment",
        normalizeCostScope(cat.costScope)
      );
      let normalizedScope = normalizeCostScope(cat.costScope);
      if (scope !== null) {
        normalizedScope = normalizeCostScope(scope, "");
        if (!normalizedScope) {
          alert("成本范围只能是 pre-delivery-cash、post-sale-support-reserve 或 fixed-launch-investment。");
          return;
        }
      }
      cat.name = name;
      cat.note = note ?? cat.note;
      cat.costScope = normalizedScope;
      save();
      render();
    }

    function addGroup(catId) {
      const cat = findCategory(catId);
      const name = prompt("子类名称", "新子类");
      if (!name) return;
      cat.groups.push(group(name, "", []));
      cat.collapsed = false;
      save();
      render();
    }

    function editGroup(catId, grpId) {
      const grp = findGroup(catId, grpId);
      const name = prompt("子类名称", grp.name);
      if (!name) return;
      grp.name = name;
      grp.note = prompt("子类备注", grp.note || "") ?? grp.note;
      save();
      renderCostViews();
    }

    function addItem(catId, grpId) {
      const grp = findGroup(catId, grpId);
      const name = prompt("物料名称", "新物料");
      if (!name) return;
      grp.items.push(item(name, "", "", 1, "pcs", "", [supplier("供应商", "", "", 0, 0, 1, "")]));
      grp.collapsed = false;
      save();
      render();
    }

    function deleteItem(catId, grpId, itemId) {
      if (!confirm("删除这个物料？")) return;
      const grp = findGroup(catId, grpId);
      grp.items = grp.items.filter((it) => it.id !== itemId);
      save();
      render();
    }

    function addSupplier(catId, grpId, itemId) {
      const it = findItem(catId, grpId, itemId);
      const sp = supplier("新供应商", "", "", 0, 0, 1, "");
      it.suppliers.push(sp);
      save();
      renderCostViews();
    }

    function deleteSupplier(catId, grpId, itemId, supplierId) {
      const it = findItem(catId, grpId, itemId);
      if (it.suppliers.length <= 1) {
        alert("至少保留一个供应商候选。");
        return;
      }
      it.suppliers = it.suppliers.filter((sp) => sp.id !== supplierId);
      if (it.chosenSupplierId === supplierId) it.chosenSupplierId = "";
      save();
      render();
    }

    function chooseSupplier(catId, grpId, itemId, supplierId) {
      const it = findItem(catId, grpId, itemId);
      it.chosenSupplierId = it.chosenSupplierId === supplierId ? "" : supplierId;
      save();
      render();
    }

    function setAllCollapsed(collapsed) {
      data.categories.forEach((cat) => {
        cat.collapsed = collapsed;
        cat.groups.forEach((grp) => {
          grp.collapsed = collapsed;
          grp.items.forEach((it) => it.collapsed = collapsed);
        });
      });
      save();
      renderCostViews();
    }

    function resetTemplate() {
      if (!store.products.length) return;
      if (!confirm("清空当前产品数据？")) return;
      const product = normalizeData(clone(blankProductTemplate));
      product.id = data.id;
      product.projectName = data.projectName || product.projectName;
      const index = store.products.findIndex((entry) => entry.id === data.id);
      store.products[index] = product;
      data = product;
      save();
      render();
    }

    function closeModal() {
      el.jsonModal.classList.remove("open");
    }

    function openCloudConfig() {
      el.cloudEndpoint.value = cloudConfig.endpoint || "";
      el.cloudDocKey.value = cloudConfig.docKey || DEFAULT_CLOUD_DOC_KEY;
      el.cloudUser.value = cloudConfig.userName || "";
      el.cloudSecret.value = cloudConfig.secret || "";
      el.cloudModal.classList.add("open");
    }

    function closeCloudConfig() {
      el.cloudModal.classList.remove("open");
    }

    function openCloudHistory() {
      if (!ensureCloudConfig()) return;
      el.historyModal.classList.add("open");
      el.historyList.innerHTML = `<div class="empty">正在读取云端历史...</div>`;
      loadCloudHistory();
    }

    function closeCloudHistory() {
      el.historyModal.classList.remove("open");
    }

    function applyCloudConfig() {
      const next = {
        endpoint: normalizeEndpoint(el.cloudEndpoint.value),
        docKey: el.cloudDocKey.value.trim() || DEFAULT_CLOUD_DOC_KEY,
        userName: el.cloudUser.value.trim(),
        secret: el.cloudSecret.value.trim()
      };
      if (!next.endpoint || !next.secret) {
        alert("Worker地址和同步密钥都要填。");
        return;
      }
      cloudConfig = next;
      saveCloudConfig();
      closeCloudConfig();
      renderCloudStatus();
    }

    function hasCloudConfig() {
      return Boolean(cloudConfig.endpoint && cloudConfig.docKey && cloudConfig.secret);
    }

    function normalizeEndpoint(value) {
      return String(value || "").trim().replace(/\/+$/, "");
    }

    function cloudUrl() {
      return `${normalizeEndpoint(cloudConfig.endpoint)}/${encodeURIComponent(cloudConfig.docKey || "default")}`;
    }

    function ensureCloudConfig() {
      if (hasCloudConfig()) return true;
      openCloudConfig();
      alert("先填云端同步设置。");
      return false;
    }

    async function saveCloud() {
      if (!store.products.length) {
        alert("请先解锁产品。");
        return;
      }
      if (!ensureCloudConfig()) return;
      try {
        const remoteMeta = await getCloudMeta();
        if (hasNewerRemote(remoteMeta)) {
          const shouldOverwrite = confirm([
            "云端已有更新的数据。",
            "",
            `最后保存人：${remoteMeta.updatedBy || "未填写"}`,
            `最后保存时间：${formatDateTime(remoteMeta.updatedAt)}`,
            `云端项目：${remoteMeta.projectName || "未命名"}`,
            "",
            "点“确定”会覆盖云端；点“取消”后请先读取云端。"
          ].join("\n"));
          if (!shouldOverwrite) {
            const shouldLoad = confirm("现在读取云端数据吗？读取会覆盖当前浏览器数据。");
            if (shouldLoad) await loadCloud({ skipConfirm: true });
            return;
          }
        }

        const savedAt = new Date().toISOString();
        const payload = {
          data: store,
          savedAt,
          updatedBy: cloudConfig.userName || DEFAULT_USER_NAME,
          projectName: `${data.projectName || "未命名产品"} 等 ${store.products.length} 个产品`
        };
        const meta = await cloudRequest("PUT", payload);
        store._cloud = {
          savedAt: meta.updatedAt || savedAt,
          savedBy: meta.updatedBy || cloudConfig.userName || DEFAULT_USER_NAME
        };
        localSavedAt = store._cloud.savedAt;
        save();
        alert("已保存到云端。");
      } catch (error) {
        alert(`保存失败：${error.message}`);
      }
    }

    async function loadCloud(options = {}) {
      if (!ensureCloudConfig()) return;
      if (!options.skipConfirm && !confirm("读取云端会覆盖当前浏览器数据。确定？")) return;
      try {
        const payload = await cloudRequest("GET");
        store = normalizeStore(payload.data || payload);
        store._cloud = {
          savedAt: payload.savedAt || payload.updatedAt || "",
          savedBy: payload.updatedBy || ""
        };
        data = activeProduct();
        localSavedAt = store._cloud.savedAt;
        save();
        render();
        alert("已读取云端数据。");
      } catch (error) {
        alert(`读取失败：${error.message}`);
      }
    }

    async function loadCloudHistory() {
      if (!ensureCloudConfig()) return;
      try {
        const payload = await cloudRequest("GET", null, "?history=1");
        renderCloudHistory(payload.history || []);
      } catch (error) {
        el.historyList.innerHTML = `<div class="empty">读取失败：${escapeHtml(error.message)}</div>`;
      }
    }

    function renderCloudHistory(history) {
      if (!history.length) {
        el.historyList.innerHTML = `<div class="empty">暂无历史记录。更新 Worker 后，下一次保存会开始记录；如果已经更新过，就先点一次“保存云端”。</div>`;
        return;
      }
      el.historyList.innerHTML = history.map((entry) => `
        <div class="history-row">
          <div class="history-version">v${escapeHtml(entry.version || "-")}</div>
          <div class="history-main">
            <div class="history-project" title="${escapeAttr(entry.projectName || "")}">${escapeHtml(entry.projectName || "未命名项目")}</div>
            <div class="history-meta">保存人：${escapeHtml(entry.updatedBy || "未填写")}</div>
            <div class="history-meta">时间：${escapeHtml(formatDateTime(entry.updatedAt))}</div>
          </div>
          <div class="history-size">${escapeHtml(formatBytes(entry.bytes))}</div>
        </div>
      `).join("");
    }

    async function cloudRequest(method, payload, suffix = "") {
      const response = await fetch(`${cloudUrl()}${suffix}`, {
        method,
        headers: {
          "Content-Type": "application/json",
          "X-Sync-Secret": cloudConfig.secret
        },
        body: payload ? JSON.stringify(payload) : undefined
      });
      const text = await response.text();
      if (!response.ok) {
        throw new Error(cloudErrorMessage(response.status, text));
      }
      return text ? JSON.parse(text) : {};
    }

    async function getCloudMeta() {
      try {
        return await cloudRequest("GET", null, "?meta=1");
      } catch (error) {
        if (!error.message.includes("云端还没有这份数据")) throw error;
      }

      try {
        const payload = await cloudRequest("GET");
        return {
          updatedAt: payload.savedAt || payload.updatedAt || payload.data?._cloud?.savedAt || "",
          updatedBy: payload.updatedBy || payload.data?._cloud?.savedBy || "旧版本保存",
          projectName: payload.projectName || payload.data?.projectName || payload.data?.products?.[0]?.projectName || ""
        };
      } catch (error) {
        if (error.message.includes("云端还没有这份数据")) return null;
        throw error;
      }
    }

    function hasNewerRemote(meta) {
      if (!meta?.updatedAt) return false;
      if (!localSavedAt) return true;
      return Date.parse(meta.updatedAt) > Date.parse(localSavedAt);
    }

    function formatDateTime(value) {
      if (!value) return "未知";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString("zh-CN", { hour12: false });
    }

    function cloudErrorMessage(status, text) {
      try {
        const body = JSON.parse(text || "{}");
        if (body.error === "unauthorized") return "同步密钥不匹配。请检查云端设置里的“同步密钥”是否等于 Cloudflare Worker 的 SYNC_SECRET。";
        if (body.error === "not found") return "云端还没有这份数据。请先点“保存云端”。";
        if (body.error === "history not available") return "当前 Worker 还没更新历史记录接口。请把新的 cloudflare-worker.js 部署到 Cloudflare。";
        if (body.error === "KV binding COST_DATA is missing") return "Worker 还没有绑定 KV，变量名必须是 COST_DATA。";
        if (body.error === "Worker secret SYNC_SECRET is missing") return "Worker 还没有设置 Secret，变量名必须是 SYNC_SECRET。";
        if (body.error) return body.error;
      } catch {}
      return text || `HTTP ${status}`;
    }

    async function copyJson() {
      await navigator.clipboard.writeText(el.jsonText.value);
    }

    function applyJson() {
      try {
        store = normalizeStore(JSON.parse(el.jsonText.value));
        data = activeProduct();
        localSavedAt = store._cloud?.savedAt || "";
        save();
        closeModal();
        render();
      } catch {
        alert("JSON格式不对。");
      }
    }
