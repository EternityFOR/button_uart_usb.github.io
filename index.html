<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产品成本与首发项目利润规划器</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #fff;
      --soft: #f8fafc;
      --line: #d9e1ea;
      --line-dark: #b6c2cf;
      --text: #17212b;
      --muted: #647384;
      --accent: #155eef;
      --accent-soft: #eaf1ff;
      --danger: #c93127;
      --good: #0f7a4f;
      --amber: #a86600;
      --amber-soft: #fff6df;
      --danger-soft: #fff0ed;
      --good-soft: #eaf8f1;
      --cost-soft: #eef5ff;
      --shadow: 0 8px 20px rgba(23, 33, 43, .06);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    button, input, select {
      font: inherit;
    }

    button {
      min-height: 32px;
      border: 1px solid var(--line-dark);
      border-radius: 6px;
      padding: 0 10px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.danger {
      border-color: #efb3ad;
      color: var(--danger);
    }

    input, select, textarea {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 8px;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 360px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
    }

    input[type="checkbox"] {
      width: 16px;
      min-height: 16px;
      padding: 0;
    }

    .topbar {
      display: grid;
      gap: 14px;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .header-primary {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      min-width: 0;
    }

    .app-title {
      min-width: 260px;
    }

    .eyebrow {
      display: block;
      margin-bottom: 4px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .app-title p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .project-name {
      max-width: none;
    }

    .product-switcher {
      display: grid;
      grid-template-columns: 72px minmax(180px, 320px) minmax(260px, 1fr) auto;
      gap: 8px;
      align-items: center;
      max-width: 1100px;
    }

    .product-switcher label {
      color: var(--muted);
      font-size: 12px;
    }

    .product-actions,
    .command-group,
    .editor-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .product-actions button,
    .editor-actions button {
      flex: 0 0 auto;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .command-bar {
      align-items: flex-start;
      max-width: 930px;
    }

    .command-group {
      padding-right: 8px;
      border-right: 1px solid var(--line);
    }

    .command-group:last-of-type {
      padding-right: 0;
      border-right: 0;
    }

    .unlock-strip {
      display: grid;
      grid-template-columns: 120px minmax(180px, 280px) minmax(240px, 1fr) auto auto minmax(180px, 320px);
      gap: 10px;
      align-items: center;
      padding: 12px 22px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    .unlock-title {
      display: grid;
      gap: 2px;
      min-width: 0;
      font-size: 13px;
      font-weight: 700;
    }

    .unlock-title span,
    .unlock-status {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .planner-page {
      display: grid;
      gap: 14px;
      padding: 16px 22px 24px;
    }

    .summary {
      display: grid;
      grid-template-columns: minmax(280px, .68fr) minmax(560px, 1.32fr);
      gap: 14px;
      min-width: 0;
    }

    .summary-card,
    .assumptions-panel,
    .editor-toolbar,
    .sidebar,
    .category {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .summary-card {
      padding: 16px;
      min-width: 0;
    }

    .decision-card {
      border-top: 4px solid var(--accent);
    }

    .decision-label,
    .summary-title,
    .bridge-label,
    .equation-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .decision-price {
      margin-top: 8px;
      font-size: 40px;
      font-weight: 850;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .decision-subtitle {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .decision-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 16px;
    }

    .decision-metric {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--soft);
    }

    .decision-metric strong {
      display: block;
      margin-top: 4px;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
    }

    .cost-formation {
      border-top: 4px solid #2d7fd3;
    }

    .summary-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .summary-head h2,
    .section-heading h2 {
      margin: 3px 0 0;
      font-size: 18px;
    }

    .summary-head p,
    .section-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .cost-equation {
      display: grid;
      grid-template-columns: minmax(130px, 1fr) 24px minmax(130px, 1fr) 24px minmax(150px, 1.08fr);
      gap: 8px;
      align-items: stretch;
    }

    .equation-node {
      min-width: 0;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--soft);
    }

    .equation-node.cost { background: var(--cost-soft); border-color: #c9ddf7; }
    .equation-node.fixed { background: var(--amber-soft); border-color: #efd69d; }
    .equation-node.full { background: #f3f0ff; border-color: #d8cdf5; }
    .equation-node.price { background: var(--good-soft); border-color: #b8dec9; }

    .equation-node strong {
      display: block;
      margin-top: 5px;
      font-size: 20px;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .equation-node small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .equation-operator {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 20px;
      font-weight: 800;
    }

    .formula-line {
      margin-top: 10px;
      padding: 9px 11px;
      border-left: 3px solid var(--accent);
      background: #f7f9fc;
      color: #354657;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .formula-line strong {
      color: var(--text);
      font-size: 14px;
    }

    .profit-bridge {
      grid-column: 1 / -1;
      border-top: 4px solid var(--good);
    }

    .bridge-track {
      display: flex;
      align-items: stretch;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .bridge-node {
      flex: 1 0 150px;
      min-width: 150px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--soft);
    }

    .bridge-node.deduction { background: var(--danger-soft); border-color: #f0c1ba; }
    .bridge-node.cost { background: var(--cost-soft); border-color: #c9ddf7; }
    .bridge-node.fixed { background: var(--amber-soft); border-color: #efd69d; }
    .bridge-node.profit { background: var(--good-soft); border-color: #b8dec9; }

    .bridge-node strong {
      display: block;
      margin-top: 5px;
      font-size: 17px;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .bridge-node small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .bridge-operator {
      flex: 0 0 22px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 18px;
      font-weight: 800;
    }

    .summary-alert {
      grid-column: 1 / -1;
      padding: 10px 12px;
      border: 1px solid #efcf8d;
      border-radius: 6px;
      background: var(--amber-soft);
      color: #714600;
      font-size: 13px;
    }

    .summary-alert.good {
      border-color: #a8d8c0;
      background: var(--good-soft);
      color: #0c603f;
    }

    .locked-summary {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .locked-summary .decision-metric {
      min-height: 72px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      min-width: 0;
    }

    .sidebar {
      position: sticky;
      top: 16px;
      padding: 12px;
    }

    .sidebar h2 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    .nav-list {
      display: grid;
      gap: 6px;
    }

    .nav-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--soft);
      color: var(--text);
      text-decoration: none;
    }

    .nav-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .nav-price {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .main {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      min-width: 0;
    }

    #categories,
    .category-body,
    .group-body,
    .item-body {
      min-width: 0;
      max-width: 100%;
    }

    .assumptions-panel {
      padding: 14px;
    }

    .section-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 12px;
    }

    .section-heading p {
      max-width: 620px;
      text-align: right;
    }

    .assumption-grid {
      display: grid;
      grid-template-columns: minmax(120px, .8fr) minmax(130px, .8fr) minmax(170px, 1fr) minmax(170px, 1fr) minmax(220px, 1.4fr);
      gap: 10px;
      align-items: end;
    }

    .editor-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, .8fr) minmax(360px, 1.6fr) auto;
      gap: 10px;
      align-items: end;
      padding: 12px;
    }

    .editor-actions {
      justify-content: flex-end;
    }

    .field label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .field {
      min-width: 0;
    }

    .category {
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-left: 4px solid #2d7fd3;
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      position: relative;
    }

    .category.scope-post-sale {
      border-left-color: #8a5fc7;
    }

    .category-header,
    .group-header,
    .item-header {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .category-header {
      padding: 10px 12px;
      background: #edf3fa;
      border-bottom: 1px solid var(--line);
    }

    .category:not(.collapsed) > .category-header {
      background: #dfeeff;
    }

    .category.scope-post-sale > .category-header {
      background: #f3effb;
    }

    .category.scope-post-sale:not(.collapsed) > .category-header {
      background: #e9e0f8;
    }

    .group-header {
      padding: 9px 12px;
      background: #f7f9fb;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .group:not(.collapsed) > .group-header {
      background: #edf8f2;
      box-shadow: inset 4px 0 0 #28a167;
    }

    .item-header {
      padding: 8px 12px;
      background: #fff;
      border-top: 1px solid #edf1f5;
    }

    .item:not(.collapsed) > .item-header {
      background: #fff7e5;
      box-shadow: inset 4px 0 0 #d99400;
    }

    .header-toggle {
      width: 100%;
      min-width: 0;
      min-height: 30px;
      display: grid;
      gap: 10px;
      align-items: center;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .header-toggle:hover {
      border-color: transparent;
      color: inherit;
    }

    .header-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .category-toggle {
      grid-template-columns: 28px minmax(180px, 1fr) auto auto auto;
    }

    .group-toggle {
      grid-template-columns: 28px minmax(180px, 1fr) auto;
    }

    .item-toggle {
      grid-template-columns: 28px minmax(220px, 1.4fr) minmax(90px, .48fr) minmax(120px, .62fr) minmax(120px, .62fr);
    }

    .twisty {
      width: 22px;
      height: 22px;
      border: 1px solid var(--line-dark);
      border-radius: 5px;
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .category:not(.collapsed) > .category-header .twisty,
    .group:not(.collapsed) > .group-header .twisty,
    .item:not(.collapsed) > .item-header .twisty {
      border-color: currentColor;
      background: #fff;
      color: var(--accent);
    }

    .category.collapsed .category-body,
    .group.collapsed .group-body,
    .item.collapsed .item-body {
      display: none;
    }

    .category.collapsed > .category-header .twisty::before,
    .group.collapsed > .group-header .twisty::before,
    .item.collapsed > .item-header .twisty::before {
      content: "›";
      font-size: 17px;
      line-height: 1;
    }

    .category:not(.collapsed) > .category-header .twisty::before,
    .group:not(.collapsed) > .group-header .twisty::before,
    .item:not(.collapsed) > .item-header .twisty::before {
      content: "⌄";
      font-size: 15px;
      line-height: 1;
    }

    .heading-main {
      min-width: 0;
    }

    .heading-main strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
    }

    .heading-main small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #0f4ed2;
      font-size: 12px;
      white-space: nowrap;
    }

    .money {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .category-tools,
    .group-tools,
    .item-tools {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
    }

    .item-row-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .item-cell {
      min-width: 0;
    }

    .item-cell strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .item-body {
      padding: 12px;
      border-top: 1px solid #edf1f5;
      background: #fcfdff;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .suppliers {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .supplier-head,
    .supplier-row {
      display: grid;
      grid-template-columns: 42px minmax(130px, 1fr) minmax(150px, 1.15fr) minmax(110px, .8fr) 110px 110px 96px 80px 104px 72px;
      gap: 8px;
      align-items: center;
      padding: 8px;
      min-width: 1060px;
    }

    .supplier-head {
      border-bottom: 1px solid var(--line);
      background: #f0f4f8;
      color: var(--muted);
      font-size: 12px;
    }

    .supplier-row {
      border-bottom: 1px solid #edf1f5;
    }

    .supplier-row:last-child {
      border-bottom: 0;
    }

    .chosen {
      color: var(--good);
      font-weight: 700;
    }

    .empty {
      padding: 24px;
      border: 1px dashed var(--line-dark);
      border-radius: 8px;
      background: var(--panel);
      text-align: center;
      color: var(--muted);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 28px;
      background: rgba(12, 20, 28, .45);
    }

    .modal.open {
      display: grid;
    }

    .modal-card {
      width: min(860px, 100%);
      max-height: min(760px, 92vh);
      overflow: auto;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .22);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .footer-note {
      padding-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .cloud-status {
      margin: 8px 0 0;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .cloud-status.ready {
      border-color: #a8d8c0;
      background: #eefaf4;
      color: var(--good);
    }

    .sync-form {
      display: grid;
      gap: 12px;
    }

    .sync-form .field {
      display: grid;
      gap: 4px;
    }

    .history-card {
      width: min(680px, 100%);
    }

    .history-list {
      max-height: 58vh;
      overflow: auto;
      display: grid;
      gap: 8px;
      padding-right: 4px;
    }

    .history-row {
      display: grid;
      grid-template-columns: 74px 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }

    .history-version {
      font-weight: 800;
      color: var(--accent);
    }

    .history-main {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .history-project {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }

    .history-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .history-size {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    @media (max-width: 1280px) {
      .assumption-grid {
        grid-template-columns: repeat(3, minmax(150px, 1fr));
      }

      .editor-toolbar {
        grid-template-columns: minmax(180px, .75fr) minmax(260px, 1.25fr) auto;
      }

      .workspace {
        grid-template-columns: 220px minmax(0, 1fr);
      }

      .item-toggle {
        grid-template-columns: 28px minmax(190px, 1.3fr) minmax(80px, .45fr) minmax(105px, .55fr) minmax(110px, .58fr);
      }
    }

    @media (max-width: 1080px) {
      .header-primary {
        display: grid;
      }

      .command-bar {
        justify-content: flex-start;
        max-width: none;
      }

      .product-switcher {
        grid-template-columns: 72px minmax(0, 1fr);
        max-width: none;
      }

      .product-switcher .project-name,
      .product-switcher .product-actions {
        grid-column: 2;
      }

      .unlock-strip {
        grid-template-columns: 110px minmax(180px, 1fr) auto auto;
      }

      .unlock-strip #productAccessCode,
      .unlock-status {
        grid-column: 2 / -1;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .profit-bridge,
      .summary-alert {
        grid-column: auto;
      }

      .workspace {
        grid-template-columns: minmax(0, 1fr);
      }

      .sidebar {
        position: static;
      }

      .nav-list {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 3px;
      }

      .nav-item {
        flex: 0 0 min(240px, 72vw);
      }

      .assumption-grid {
        grid-template-columns: repeat(3, minmax(140px, 1fr));
      }

      .editor-toolbar {
        grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr);
      }

      .editor-actions {
        grid-column: 1 / -1;
        justify-content: flex-start;
      }
    }

    @media (max-width: 720px) {
      .topbar,
      .planner-page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .app-title {
        min-width: 0;
      }

      h1 {
        font-size: 21px;
      }

      .command-bar,
      .command-group {
        width: 100%;
        justify-content: flex-start;
      }

      .command-group {
        flex-wrap: wrap;
        padding-right: 0;
        padding-bottom: 7px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .product-switcher {
        grid-template-columns: 1fr;
      }

      .product-switcher .project-name,
      .product-switcher .product-actions {
        grid-column: auto;
      }

      .product-actions,
      .editor-actions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: 100%;
      }

      .product-actions button,
      .editor-actions button {
        min-width: 0;
        padding-left: 6px;
        padding-right: 6px;
      }

      .unlock-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        padding-left: 14px;
        padding-right: 14px;
      }

      .unlock-title,
      .unlock-strip select,
      .unlock-strip #productAccessCode,
      .unlock-status {
        grid-column: 1 / -1;
      }

      .section-heading {
        display: grid;
        gap: 6px;
      }

      .section-heading p {
        max-width: none;
        text-align: left;
      }

      .assumption-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .assumption-grid .field:last-child {
        grid-column: 1 / -1;
      }

      .editor-toolbar {
        grid-template-columns: 1fr;
      }

      .editor-actions {
        grid-column: auto;
      }

      .decision-grid,
      .locked-summary {
        grid-template-columns: 1fr;
      }

      .cost-equation {
        grid-template-columns: 1fr;
      }

      .equation-operator {
        min-height: 20px;
      }

      .category-header,
      .group-header,
      .item-header {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .category-tools,
      .group-tools,
      .item-tools {
        justify-content: flex-start;
      }

      .category-toggle {
        grid-template-columns: 28px minmax(0, 1fr) auto;
      }

      .category-toggle .pill {
        display: none;
      }

      .group-toggle {
        grid-template-columns: 28px minmax(0, 1fr) auto;
      }

      .item-toggle {
        grid-template-columns: 28px minmax(0, 1fr) auto;
      }

      .item-toggle .summary-qty,
      .item-toggle .summary-supplier {
        display: none;
      }

      .detail-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .modal {
        padding: 12px;
      }
    }

    @media (max-width: 480px) {
      .assumption-grid,
      .detail-grid {
        grid-template-columns: 1fr;
      }

      .assumption-grid .field:last-child {
        grid-column: auto;
      }

      .decision-price {
        font-size: 34px;
      }

      .product-actions button,
      .editor-actions button {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="header-primary">
      <div class="app-title">
        <span class="eyebrow">DeDge Cost Planner</span>
        <h1>产品成本与首发项目利润规划器</h1>
        <p>从履约成本、固定投入和渠道扣减反推可执行售价。</p>
      </div>
      <div class="actions command-bar">
        <div class="command-group" aria-label="数据操作">
          <button id="exportCsvBtn">导出 CSV</button>
          <button id="exportJsonBtn">导出 JSON</button>
          <button id="importJsonBtn">导入 JSON</button>
        </div>
        <div class="command-group" aria-label="云端操作">
          <button class="primary" id="saveCloudBtn">保存云端</button>
          <button id="loadCloudBtn">读取云端</button>
          <button id="cloudHistoryBtn">云端历史</button>
          <button id="cloudConfigBtn">云端设置</button>
        </div>
        <button class="danger" id="resetBtn">清空当前</button>
      </div>
    </div>
    <div class="product-switcher">
      <label for="productSelect">当前产品</label>
      <select id="productSelect"></select>
      <input class="project-name" id="projectName" aria-label="产品名称" placeholder="产品名称">
      <div class="product-actions" aria-label="产品操作">
        <button id="addProductBtn">新增产品</button>
        <button id="duplicateProductBtn">复制产品</button>
        <button class="danger" id="deleteProductBtn">删除产品</button>
      </div>
    </div>
  </header>

  <section class="unlock-strip">
    <div class="unlock-title">产品解锁</div>
    <select id="vaultProductSelect" aria-label="选择要解锁的产品"></select>
    <input id="productAccessCode" type="password" autocomplete="off" placeholder="输入访问码">
    <button class="primary" id="unlockProductBtn">解锁产品</button>
    <button id="lockSessionBtn">清除解锁</button>
    <div class="unlock-status" id="unlockStatus">正在加载密文包...</div>
  </section>

  <main class="planner-page">
    <section class="summary" id="summary"></section>

    <section class="assumptions-panel">
      <div class="section-heading">
        <div>
          <span class="eyebrow">Pricing assumptions</span>
          <h2>定价假设</h2>
        </div>
        <p>这些参数决定单位首发完全成本如何转换为最低平均售价。</p>
      </div>
      <div class="assumption-grid">
        <div class="field">
          <label for="batchQty">生产数量</label>
          <input id="batchQty" type="number" min="1" step="1">
        </div>
        <div class="field">
          <label for="currency">币种</label>
          <select id="currency">
            <option value="¥">¥ 人民币</option>
            <option value="HK$">HK$ 港币</option>
            <option value="$">$ 美元</option>
          </select>
        </div>
        <div class="field">
          <label for="targetProjectProfitMargin">目标首发项目利润率 %</label>
          <input id="targetProjectProfitMargin" type="number" min="0" max="60" step="1">
        </div>
        <div class="field">
          <label for="salesFeeRate">销售渠道扣减率 %</label>
          <input id="salesFeeRate" type="number" min="0" max="30" step="0.5">
        </div>
        <div class="field">
          <label for="fixedLaunchCost">首发固定投入</label>
          <input id="fixedLaunchCost" type="number" min="0" step="1">
        </div>
      </div>
    </section>

    <div class="workspace">
      <aside class="sidebar">
        <h2>成本分类</h2>
        <div class="nav-list" id="categoryNav"></div>
        <p class="footer-note">当前会话数据</p>
        <p class="cloud-status" id="cloudStatus">云端未配置</p>
      </aside>

      <section class="main">
        <div class="editor-toolbar">
          <div class="field search-field">
          <label for="filterText">搜索物料/供应商</label>
          <input id="filterText" placeholder="如 物料、供应商、规格">
          </div>
          <div class="field note-field">
          <label for="globalNote">项目备注</label>
          <input id="globalNote" placeholder="版本、样机、量产、采购批次">
          </div>
          <div class="editor-actions" aria-label="成本明细操作">
            <button id="expandAllBtn">全部展开</button>
            <button id="collapseAllBtn">全部折叠</button>
            <button class="primary" id="addCategoryBtn">新增大类</button>
          </div>
        </div>

        <div id="categories"></div>
      </section>
    </div>
  </main>

  <div class="modal" id="jsonModal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">JSON</h2>
        <div class="actions">
          <button id="copyJsonBtn">复制</button>
          <button class="primary" id="applyJsonBtn">应用导入</button>
          <button id="closeModalBtn">关闭</button>
        </div>
      </div>
      <textarea id="jsonText"></textarea>
      <p class="footer-note">导入会覆盖当前浏览器里的表格数据，建议先导出备份。</p>
    </div>
  </div>

  <div class="modal" id="cloudModal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2>云端同步设置</h2>
        <div class="actions">
          <button class="primary" id="saveCloudConfigBtn">保存设置</button>
          <button id="closeCloudModalBtn">关闭</button>
        </div>
      </div>
      <div class="sync-form">
        <div class="field">
          <label for="cloudEndpoint">Worker地址</label>
          <input id="cloudEndpoint" placeholder="https://你的-worker.workers.dev">
        </div>
        <div class="field">
          <label for="cloudDocKey">数据Key</label>
          <input id="cloudDocKey" placeholder="product-cost">
        </div>
        <div class="field">
          <label for="cloudUser">你的名字</label>
          <input id="cloudUser" placeholder="如 William / 采购A">
        </div>
        <div class="field">
          <label for="cloudSecret">同步密钥</label>
          <input id="cloudSecret" type="password" placeholder="只发给需要同步成本表的人">
        </div>
      </div>
      <p class="footer-note">填写同步接口地址、数据Key、名称和同步密钥。</p>
    </div>
  </div>

  <div class="modal" id="historyModal" role="dialog" aria-modal="true">
    <div class="modal-card history-card">
      <div class="modal-head">
        <h2>云端历史记录</h2>
        <div class="actions">
          <button id="refreshHistoryBtn">刷新</button>
          <button id="closeHistoryModalBtn">关闭</button>
        </div>
      </div>
      <div class="history-list" id="historyList"></div>
      <p class="footer-note">记录来自 Cloudflare Worker；旧 Worker 需要更新后，新的保存才会追加历史。</p>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "dedge-cost-planner-session-v1";
    const LEGACY_STORAGE_KEY = "cost-planner-v1";
    const CLOUD_CONFIG_KEY = "cost-planner-cloud-config-v1";
    const DEFAULT_CLOUD_DOC_KEY = "product-cost";
    const DEFAULT_USER_NAME = "未填写";
    const VAULT_URL = "data/cost-vault.json";
    const COST_SCOPE_PRE_DELIVERY_CASH = "pre-delivery-cash";
    const COST_SCOPE_POST_SALE_SUPPORT = "post-sale-support-reserve";
    const FINANCIAL_TERMINOLOGY_VERSION = "2026-07-17-full-cost";

    const blankProductTemplate = {
      projectName: "未命名成本表",
      batchQty: 100,
      currency: "¥",
      targetFirstLaunchProjectProfitMargin: 30,
      salesFeeRate: 0,
      fixedLaunchCost: 0,
      note: "",
      categories: []
    };

    let store = loadStore();
    let data = activeProduct();
    let cloudConfig = loadCloudConfig();
    let costVault = null;
    let filterText = "";
    let localSavedAt = store._cloud?.savedAt || "";

    const el = {
      vaultProductSelect: document.getElementById("vaultProductSelect"),
      productAccessCode: document.getElementById("productAccessCode"),
      unlockStatus: document.getElementById("unlockStatus"),
      productSelect: document.getElementById("productSelect"),
      projectName: document.getElementById("projectName"),
      batchQty: document.getElementById("batchQty"),
      currency: document.getElementById("currency"),
      targetProjectProfitMargin: document.getElementById("targetProjectProfitMargin"),
      salesFeeRate: document.getElementById("salesFeeRate"),
      fixedLaunchCost: document.getElementById("fixedLaunchCost"),
      globalNote: document.getElementById("globalNote"),
      summary: document.getElementById("summary"),
      categoryNav: document.getElementById("categoryNav"),
      categories: document.getElementById("categories"),
      filterText: document.getElementById("filterText"),
      jsonModal: document.getElementById("jsonModal"),
      jsonText: document.getElementById("jsonText"),
      modalTitle: document.getElementById("modalTitle"),
      applyJsonBtn: document.getElementById("applyJsonBtn"),
      copyJsonBtn: document.getElementById("copyJsonBtn"),
      cloudStatus: document.getElementById("cloudStatus"),
      cloudModal: document.getElementById("cloudModal"),
      cloudEndpoint: document.getElementById("cloudEndpoint"),
      cloudDocKey: document.getElementById("cloudDocKey"),
      cloudUser: document.getElementById("cloudUser"),
      cloudSecret: document.getElementById("cloudSecret"),
      historyModal: document.getElementById("historyModal"),
      historyList: document.getElementById("historyList")
    };

    bindGlobalEvents();
    render();
    loadVault();

    function uid() {
      return Math.random().toString(36).slice(2, 10);
    }

    function category(name, note, groups, costScope = COST_SCOPE_PRE_DELIVERY_CASH) {
      return { id: uid(), name, note, costScope, collapsed: false, groups };
    }

    function group(name, note, items) {
      return { id: uid(), name, note, collapsed: false, items };
    }

    function item(name, designator, footprint, qty, unit, note, suppliers) {
      return {
        id: uid(),
        name,
        designator,
        footprint,
        qty,
        unit,
        lossRate: 0,
        processCost: 0,
        note,
        chosenSupplierId: "",
        collapsed: true,
        suppliers
      };
    }

    function supplier(name, sku, model, price, shipping, moq, note) {
      return {
        id: uid(),
        name,
        sku,
        model,
        price,
        shipping,
        moq,
        pricingMode: note === "batch" ? "batch" : "unit",
        note
      };
    }

    function loadStore() {
      const raw = sessionStorage.getItem(STORAGE_KEY);
      if (!raw) return createStore([]);
      try {
        return normalizeStore(JSON.parse(raw));
      } catch {
        return createStore([]);
      }
    }

    function createStore(products = []) {
      const normalizedProducts = products.map((product) => normalizeData(product));
      normalizedProducts.forEach((product) => product.id ||= uid());
      return {
        version: 2,
        activeProductId: normalizedProducts[0]?.id || "",
        products: normalizedProducts
      };
    }

    function normalizeStore(value) {
      if (Array.isArray(value?.products)) {
        const next = {
          version: 2,
          activeProductId: value.activeProductId || "",
          products: value.products.map((product) => normalizeData(product)),
          _cloud: value._cloud || null,
          _localUpdatedAt: value._localUpdatedAt || ""
        };
        next.products.forEach((product) => product.id ||= uid());
        if (next.products.length && !next.products.some((product) => product.id === next.activeProductId)) {
          next.activeProductId = next.products[0].id;
        }
        return next;
      }
      return value?.categories ? createStore([value]) : createStore([]);
    }

    function normalizeData(value) {
      const next = { ...clone(blankProductTemplate), ...value };
      next.id ||= uid();
      next.categories = Array.isArray(value?.categories) ? value.categories : [];
      next.targetFirstLaunchProjectProfitMargin = value?.targetFirstLaunchProjectProfitMargin
        ?? value?.compatibilityAliases?.targetNetMargin
        ?? value?.targetNetMargin
        ?? value?.targetMargin
        ?? 30;
      const compatibilityAliases = { ...(value?.compatibilityAliases || {}) };
      delete compatibilityAliases.targetNetMargin;
      if (Object.keys(compatibilityAliases).length) next.compatibilityAliases = compatibilityAliases;
      else delete next.compatibilityAliases;
      delete next.targetNetMargin;
      delete next.targetMargin;
      next.salesFeeRate = value?.salesFeeRate ?? 0;
      next.fixedLaunchCost = value?.fixedLaunchCost ?? 0;
      delete next.financialSummary;
      next.categories.forEach((cat) => {
        cat.groups ||= [];
        cat.costScope = normalizeCostScope(
          cat.costScope || (cat.id === "support-reserve" ? COST_SCOPE_POST_SALE_SUPPORT : COST_SCOPE_PRE_DELIVERY_CASH)
        );
      });
      walkItems(next, (it) => {
        it.suppliers ||= [];
        if (!it.suppliers.some((sp) => sp.id === it.chosenSupplierId)) it.chosenSupplierId = "";
        it.lossRate = number(it.lossRate);
        it.processCost = number(it.processCost);
        it.qty = number(it.qty);
        it.suppliers.forEach((sp) => {
          sp.pricingMode ||= sp.note === "batch" ? "batch" : "unit";
        });
      });
      return next;
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function activeProduct() {
      return store.products.find((product) => product.id === store.activeProductId) || store.products[0] || clone(blankProductTemplate);
    }

    function setActiveProduct(productId) {
      const product = store.products.find((entry) => entry.id === productId);
      if (!product) return;
      store.activeProductId = product.id;
      data = product;
      filterText = "";
      el.filterText.value = "";
      save();
      render();
    }

    function save() {
      store._localUpdatedAt = new Date().toISOString();
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    }

    function loadCloudConfig() {
      const fallback = { endpoint: "", docKey: DEFAULT_CLOUD_DOC_KEY, userName: "", secret: "" };
      const raw = localStorage.getItem(CLOUD_CONFIG_KEY);
      if (!raw) return fallback;
      try {
        return { ...fallback, ...JSON.parse(raw) };
      } catch {
        return fallback;
      }
    }

    function saveCloudConfig() {
      localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cloudConfig));
    }

    function bindGlobalEvents() {
      document.getElementById("unlockProductBtn").addEventListener("click", unlockProduct);
      document.getElementById("lockSessionBtn").addEventListener("click", clearUnlockedProducts);
      el.productAccessCode.addEventListener("keydown", (event) => {
        if (event.key === "Enter") unlockProduct();
      });
      el.productSelect.addEventListener("change", () => setActiveProduct(el.productSelect.value));
      document.getElementById("addProductBtn").addEventListener("click", addProduct);
      document.getElementById("duplicateProductBtn").addEventListener("click", duplicateProduct);
      document.getElementById("deleteProductBtn").addEventListener("click", deleteProduct);
      bindRootField(el.projectName, "projectName", () => el.projectName.value);
      bindRootField(el.batchQty, "batchQty", () => number(el.batchQty.value));
      el.currency.addEventListener("change", () => updateRoot("currency", el.currency.value, true));
      bindRootField(el.targetProjectProfitMargin, "targetFirstLaunchProjectProfitMargin", () => number(el.targetProjectProfitMargin.value));
      bindRootField(el.salesFeeRate, "salesFeeRate", () => number(el.salesFeeRate.value));
      bindRootField(el.fixedLaunchCost, "fixedLaunchCost", () => number(el.fixedLaunchCost.value));
      el.globalNote.addEventListener("input", () => updateRoot("note", el.globalNote.value, false, false));
      el.globalNote.addEventListener("blur", () => updateRoot("note", el.globalNote.value, true, false));
      el.filterText.addEventListener("input", () => {
        filterText = el.filterText.value.trim().toLowerCase();
        renderCategories();
      });
      document.getElementById("addCategoryBtn").addEventListener("click", addCategory);
      document.getElementById("expandAllBtn").addEventListener("click", () => setAllCollapsed(false));
      document.getElementById("collapseAllBtn").addEventListener("click", () => setAllCollapsed(true));
      document.getElementById("exportCsvBtn").addEventListener("click", exportCsv);
      document.getElementById("exportJsonBtn").addEventListener("click", openExportJson);
      document.getElementById("importJsonBtn").addEventListener("click", openImportJson);
      document.getElementById("saveCloudBtn").addEventListener("click", saveCloud);
      document.getElementById("loadCloudBtn").addEventListener("click", loadCloud);
      document.getElementById("cloudHistoryBtn").addEventListener("click", openCloudHistory);
      document.getElementById("cloudConfigBtn").addEventListener("click", openCloudConfig);
      document.getElementById("resetBtn").addEventListener("click", resetTemplate);
      document.getElementById("closeModalBtn").addEventListener("click", closeModal);
      document.getElementById("closeCloudModalBtn").addEventListener("click", closeCloudConfig);
      document.getElementById("closeHistoryModalBtn").addEventListener("click", closeCloudHistory);
      document.getElementById("refreshHistoryBtn").addEventListener("click", loadCloudHistory);
      document.getElementById("saveCloudConfigBtn").addEventListener("click", applyCloudConfig);
      el.copyJsonBtn.addEventListener("click", copyJson);
      el.applyJsonBtn.addEventListener("click", applyJson);
    }

    function bindRootField(node, key, readValue) {
      node.addEventListener("input", () => updateRoot(key, readValue(), false));
      node.addEventListener("blur", () => updateRoot(key, readValue(), true));
    }

    function updateRoot(key, value, rebuildDetails = false, refreshOverview = true) {
      if (!store.products.length) return;
      data[key] = value;
      save();
      if (rebuildDetails) {
        if (key === "projectName") renderProductSelect();
        renderCostViews();
      } else if (refreshOverview) {
        renderSummary();
      }
    }

    async function loadVault() {
      setUnlockStatus("正在加载密文包...");
      try {
        const response = await fetch(VAULT_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        costVault = await response.json();
        renderVaultOptions();
        setUnlockStatus(`可解锁产品：${costVault.products?.length || 0} 个`);
      } catch (error) {
        costVault = { products: [] };
        renderVaultOptions();
        setUnlockStatus(`密文包读取失败：${error.message}`);
      }
    }

    function renderVaultOptions() {
      const products = Array.isArray(costVault?.products) ? costVault.products : [];
      el.vaultProductSelect.innerHTML = products.length
        ? products.map((product) => `<option value="${escapeAttr(product.id)}">${escapeHtml(product.label || product.id)}</option>`).join("")
        : `<option value="">暂无可解锁产品</option>`;
      el.vaultProductSelect.disabled = !products.length;
      document.getElementById("unlockProductBtn").disabled = !products.length;
    }

    async function unlockProduct() {
      if (!costVault) await loadVault();
      const productId = el.vaultProductSelect.value;
      const entry = costVault?.products?.find((product) => product.id === productId);
      const accessCode = el.productAccessCode.value.trim();
      if (!entry) {
        alert("没有找到可解锁的产品。");
        return;
      }
      if (!accessCode) {
        alert("请先输入访问码。");
        return;
      }

      setUnlockStatus("正在解锁...");
      try {
        const product = normalizeData(await decryptVaultProduct(entry, accessCode));
        product._vault = {
          id: entry.id,
          label: entry.label || "",
          unlockedAt: new Date().toISOString()
        };
        const index = store.products.findIndex((item) => item.id === product.id || item._vault?.id === entry.id);
        if (index >= 0) {
          store.products[index] = product;
        } else {
          store.products.push(product);
        }
        store.activeProductId = product.id;
        data = product;
        el.productAccessCode.value = "";
        save();
        render();
        setUnlockStatus(`已解锁：${product.projectName || entry.label || product.id}`);
      } catch {
        setUnlockStatus("解锁失败");
        alert("访问码不匹配，或数据包已损坏。");
      }
    }

    async function decryptVaultProduct(entry, accessCode) {
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(accessCode),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: fromBase64(entry.salt),
          iterations: number(costVault?.kdf?.iterations) || 210000,
          hash: costVault?.kdf?.hash || "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromBase64(entry.iv) },
        key,
        fromBase64(entry.ciphertext)
      );
      return JSON.parse(new TextDecoder().decode(plaintext));
    }

    function fromBase64(value) {
      const binary = atob(value);
      return Uint8Array.from(binary, (char) => char.charCodeAt(0));
    }

    function clearUnlockedProducts() {
      if (store.products.length && !confirm("清除当前浏览器里已解锁的产品数据？")) return;
      sessionStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(LEGACY_STORAGE_KEY);
      store = createStore([]);
      data = activeProduct();
      localSavedAt = "";
      render();
      setUnlockStatus("已清除解锁数据");
    }

    function setUnlockStatus(text) {
      el.unlockStatus.textContent = text;
    }

    function addProduct() {
      const name = prompt("产品名称", `新产品 ${store.products.length + 1}`);
      if (!name) return;
      const product = normalizeData(clone(blankProductTemplate));
      product.id = uid();
      product.projectName = name;
      product.categories.forEach((cat) => cat.collapsed = false);
      store.products.push(product);
      store.activeProductId = product.id;
      data = product;
      save();
      render();
    }

    function duplicateProduct() {
      if (!store.products.length) return;
      const name = prompt("复制后的产品名称", `${data.projectName || "未命名产品"} 副本`);
      if (!name) return;
      const product = normalizeData(clone(data));
      product.id = uid();
      product.projectName = name;
      product._cloud = null;
      product._localUpdatedAt = "";
      store.products.push(product);
      store.activeProductId = product.id;
      data = product;
      save();
      render();
    }

    function deleteProduct() {
      if (!store.products.length) {
        alert("当前没有已解锁产品。");
        return;
      }
      if (!confirm(`删除产品“${data.projectName || "未命名产品"}”？`)) return;
      const deleteId = data.id;
      store.products = store.products.filter((product) => product.id !== deleteId);
      store.activeProductId = store.products[0]?.id || "";
      data = activeProduct();
      save();
      render();
    }

    function renderSupplier(cat, grp, it, sp) {
      const checked = it.chosenSupplierId === sp.id;
      return `
        <div class="supplier-row">

          <input value="${escapeAttr(sp.sku)}" data-supplier-field="sku" data-category-id="${cat.id}" data-group-id="${grp.id}" data-item-id="${it.id}" data-supplier-id="${sp.id}">

          <input type="number" min="0" step="0.0001" value="${escapeAttr(sp.price)}" data-supplier-field="price" data-category-id="${cat.id}" data-group-id="${grp.id}" data-item-id="${it.id}" data-supplier-id="${sp.id}">
          <input type="number" min="0" step="0.0001" value="${escapeAttr(sp.shipping)}" data-supplier-field="shipping" data-category-id="${cat.id}" data-group-id="${grp.id}" data-item-id="${it.id}" data-supplier-id="${sp.id}">

    function headerCell(value, label, className = "") {
      return `<span class="item-cell ${escapeAttr(className)}"><span class="item-row-label">${escapeHtml(label)}</span><strong>${escapeHtml(value ?? "")}</strong></span>`;
    }

    function fieldHtml(label, field, value, catId, grpId, itemId, type = "text") {
      return `<div class="field"><label>${escapeHtml(label)}</label><input type="${type}" value="${escapeAttr(value ?? "")}" data-item-field="${field}" data-category-id="${catId}" data-group-id="${grpId}" data-item-id="${itemId}"></div>`;
    }

    function bindRenderedEvents() {
      document.querySelectorAll("[data-toggle-category]").forEach((node) => {
        node.addEventListener("click", (event) => {
          if (event.target.closest("[data-action]")) return;
          const cat = findCategory(node.dataset.toggleCategory);
          cat.collapsed = !cat.collapsed;
          save();
          renderCategories();
        });
      });
      document.querySelectorAll("[data-toggle-group]").forEach((node) => {
        node.addEventListener("click", (event) => {
          if (event.target.closest("[data-action]")) return;
          const [catId, grpId] = node.dataset.toggleGroup.split(":");
          const grp = findGroup(catId, grpId);
          grp.collapsed = !grp.collapsed;
          save();
          renderCategories();
        });
      });
      document.querySelectorAll("[data-toggle-item]").forEach((node) => {
        node.addEventListener("click", (event) => {
          if (event.target.closest("[data-action]")) return;
          const [catId, grpId, itemId] = node.dataset.toggleItem.split(":");
          const it = findItem(catId, grpId, itemId);
          it.collapsed = !it.collapsed;
          save();
          renderCategories();
        });
      });
      document.querySelectorAll("[data-action]").forEach((node) => node.addEventListener("click", handleAction));
      document.querySelectorAll("[data-item-field]").forEach((node) => {
        node.addEventListener("input", (event) => handleItemField(event, false));
        node.addEventListener("blur", (event) => handleItemField(event, true));
      });
      document.querySelectorAll("[data-supplier-field]").forEach((node) => {
        node.addEventListener("input", (event) => handleSupplierField(event, false));
        node.addEventListener(node.tagName === "SELECT" ? "change" : "blur", (event) => handleSupplierField(event, true));
      });
    }

    function handleAction(event) {
      const action = event.currentTarget.dataset.action;
      if (!action) return;
      event.stopPropagation();
      const d = event.currentTarget.dataset;
      if (action === "add-group") addGroup(d.categoryId);
      if (action === "edit-category") editCategory(d.categoryId);
      if (action === "add-item") addItem(d.categoryId, d.groupId);
      if (action === "edit-group") editGroup(d.categoryId, d.groupId);
      if (action === "edit-item") {
        findItem(d.categoryId, d.groupId, d.itemId).collapsed = false;
        save();
        renderCategories();
      }
      if (action === "add-supplier") addSupplier(d.categoryId, d.groupId, d.itemId);
      if (action === "delete-item") deleteItem(d.categoryId, d.groupId, d.itemId);
      if (action === "delete-supplier") deleteSupplier(d.categoryId, d.groupId, d.itemId, d.supplierId);
      if (action === "choose-supplier") chooseSupplier(d.categoryId, d.groupId, d.itemId, d.supplierId);
    }

    function handleItemField(event, rebuildDetails) {
      const d = event.currentTarget.dataset;
      const it = findItem(d.categoryId, d.groupId, d.itemId);
      it[d.itemField] = event.currentTarget.type === "number" ? number(event.currentTarget.value) : event.currentTarget.value;
      save();
      if (rebuildDetails) renderCostViews();
      else renderSummary();
    }

    function handleSupplierField(event, rebuildDetails) {
      const d = event.currentTarget.dataset;
      const sp = findSupplier(d.categoryId, d.groupId, d.itemId, d.supplierId);
      sp[d.supplierField] = event.currentTarget.type === "number" ? number(event.currentTarget.value) : event.currentTarget.value;
      save();
      if (rebuildDetails) renderCostViews();
      else renderSummary();
    }

    function addCategory() {
      if (!store.products.length) return;
      const name = prompt("大类名称", "新大类");
      if (!name) return;
      data.categories.push(category(name, "", [], COST_SCOPE_PRE_DELIVERY_CASH));
      save();
      render();
    }

    function editCategory(catId) {
      const cat = findCategory(catId);
      const name = prompt("大类名称", cat.name);
      if (!name) return;
      const note = prompt("大类备注", cat.note || "");
      const scope = prompt(
        "成本范围代码：pre-delivery-cash 或 post-sale-support-reserve",
        normalizeCostScope(cat.costScope)
      );
      let normalizedScope = normalizeCostScope(cat.costScope);
      if (scope !== null) {
        normalizedScope = normalizeCostScope(scope, "");
        if (!normalizedScope) {
          alert("成本范围只能是 pre-delivery-cash 或 post-sale-support-reserve。");
          return;
        }
      }
      cat.name = name;
      cat.note = note ?? cat.note;
      cat.costScope = normalizedScope;
      save();
      render();
    }

    function addGroup(catId) {
      const cat = findCategory(catId);
      const name = prompt("子类名称", "新子类");
      if (!name) return;
      cat.groups.push(group(name, "", []));
      cat.collapsed = false;
      save();
      render();
    }

    function editGroup(catId, grpId) {
      const grp = findGroup(catId, grpId);
      const name = prompt("子类名称", grp.name);
      if (!name) return;
      grp.name = name;
      grp.note = prompt("子类备注", grp.note || "") ?? grp.note;
      save();
      renderCostViews();
    }

    function addItem(catId, grpId) {
      const grp = findGroup(catId, grpId);
      const name = prompt("物料名称", "新物料");
      if (!name) return;
      grp.items.push(item(name, "", "", 1, "pcs", "", [supplier("供应商", "", "", 0, 0, 1, "")]));
      grp.collapsed = false;
      save();
      render();
    }

    function deleteItem(catId, grpId, itemId) {
      if (!confirm("删除这个物料？")) return;
      const grp = findGroup(catId, grpId);
      grp.items = grp.items.filter((it) => it.id !== itemId);
      save();
      render();
    }

    function addSupplier(catId, grpId, itemId) {
      const it = findItem(catId, grpId, itemId);
      const sp = supplier("新供应商", "", "", 0, 0, 1, "");
      it.suppliers.push(sp);
      save();
      renderCostViews();
    }

    function deleteSupplier(catId, grpId, itemId, supplierId) {
      const it = findItem(catId, grpId, itemId);
      if (it.suppliers.length <= 1) {
        alert("至少保留一个供应商候选。");
        return;
      }
      it.suppliers = it.suppliers.filter((sp) => sp.id !== supplierId);
      if (it.chosenSupplierId === supplierId) it.chosenSupplierId = "";
      save();
      render();
    }

    function chooseSupplier(catId, grpId, itemId, supplierId) {
      const it = findItem(catId, grpId, itemId);
      it.chosenSupplierId = it.chosenSupplierId === supplierId ? "" : supplierId;
      save();
      render();
    }

    function setAllCollapsed(collapsed) {
      data.categories.forEach((cat) => {
        cat.collapsed = collapsed;
        cat.groups.forEach((grp) => {
          grp.collapsed = collapsed;
          grp.items.forEach((it) => it.collapsed = collapsed);
        });
      });
      save();
      renderCostViews();
    }

    function resetTemplate() {
      if (!store.products.length) return;
      if (!confirm("清空当前产品数据？")) return;
      const product = normalizeData(clone(blankProductTemplate));
      product.id = data.id;
      product.projectName = data.projectName || product.projectName;
      const index = store.products.findIndex((entry) => entry.id === data.id);

    function openCloudConfig() {
      el.cloudEndpoint.value = cloudConfig.endpoint || "";
      el.cloudDocKey.value = cloudConfig.docKey || DEFAULT_CLOUD_DOC_KEY;
      el.cloudUser.value = cloudConfig.userName || "";
      el.cloudSecret.value = cloudConfig.secret || "";
      el.cloudModal.classList.add("open");
    }

    function closeCloudConfig() {
      el.cloudModal.classList.remove("open");
    }

    function openCloudHistory() {
      if (!ensureCloudConfig()) return;
      el.historyModal.classList.add("open");
      el.historyList.innerHTML = `<div class="empty">正在读取云端历史...</div>`;
      loadCloudHistory();
    }

    function closeCloudHistory() {
      el.historyModal.classList.remove("open");
    }

    function applyCloudConfig() {
      const next = {
        endpoint: normalizeEndpoint(el.cloudEndpoint.value),
        docKey: el.cloudDocKey.value.trim() || DEFAULT_CLOUD_DOC_KEY,
        userName: el.cloudUser.value.trim(),
        secret: el.cloudSecret.value.trim()
      };
      if (!next.endpoint || !next.secret) {
        alert("Worker地址和同步密钥都要填。");
        return;
      }
      cloudConfig = next;
      saveCloudConfig();
      closeCloudConfig();
      renderCloudStatus();
    }

    function hasCloudConfig() {
      return Boolean(cloudConfig.endpoint && cloudConfig.docKey && cloudConfig.secret);
    }

    function normalizeEndpoint(value) {
      return String(value || "").trim().replace(/\/+$/, "");
    }

    function cloudUrl() {
      return `${normalizeEndpoint(cloudConfig.endpoint)}/${encodeURIComponent(cloudConfig.docKey || "default")}`;
    }

    function ensureCloudConfig() {
      if (hasCloudConfig()) return true;
      openCloudConfig();
      alert("先填云端同步设置。");
      return false;
    }

    async function saveCloud() {
      if (!store.products.length) {
        alert("请先解锁产品。");
        return;
      }
      if (!ensureCloudConfig()) return;
      try {
        const remoteMeta = await getCloudMeta();
        if (hasNewerRemote(remoteMeta)) {
          const shouldOverwrite = confirm([
            "云端已有更新的数据。",
            "",
            `最后保存人：${remoteMeta.updatedBy || "未填写"}`,
            `最后保存时间：${formatDateTime(remoteMeta.updatedAt)}`,
            `云端项目：${remoteMeta.projectName || "未命名"}`,
            "",
            "点“确定”会覆盖云端；点“取消”后请先读取云端。"
          ].join("\n"));
          if (!shouldOverwrite) {
            const shouldLoad = confirm("现在读取云端数据吗？读取会覆盖当前浏览器数据。");
            if (shouldLoad) await loadCloud({ skipConfirm: true });
            return;
          }
        }

        const savedAt = new Date().toISOString();
        const payload = {
          data: store,
          savedAt,
          updatedBy: cloudConfig.userName || DEFAULT_USER_NAME,
          projectName: `${data.projectName || "未命名产品"} 等 ${store.products.length} 个产品`
        };
        const meta = await cloudRequest("PUT", payload);
        store._cloud = {
          savedAt: meta.updatedAt || savedAt,
          savedBy: meta.updatedBy || cloudConfig.userName || DEFAULT_USER_NAME
        };
        localSavedAt = store._cloud.savedAt;
        save();
        alert("已保存到云端。");
      } catch (error) {
        alert(`保存失败：${error.message}`);
      }
    }

    async function loadCloud(options = {}) {
      if (!ensureCloudConfig()) return;
      if (!options.skipConfirm && !confirm("读取云端会覆盖当前浏览器数据。确定？")) return;
      try {
        const payload = await cloudRequest("GET");
        store = normalizeStore(payload.data || payload);
        store._cloud = {
          savedAt: payload.savedAt || payload.updatedAt || "",
          savedBy: payload.updatedBy || ""
        };
        data = activeProduct();
        localSavedAt = store._cloud.savedAt;
        save();
        render();
        alert("已读取云端数据。");
      } catch (error) {
        alert(`读取失败：${error.message}`);
      }
    }

    async function loadCloudHistory() {
      if (!ensureCloudConfig()) return;
      try {
        const payload = await cloudRequest("GET", null, "?history=1");
        renderCloudHistory(payload.history || []);
      } catch (error) {
        el.historyList.innerHTML = `<div class="empty">读取失败：${escapeHtml(error.message)}</div>`;
      }
    }

    function renderCloudHistory(history) {
      if (!history.length) {
        el.historyList.innerHTML = `<div class="empty">暂无历史记录。更新 Worker 后，下一次保存会开始记录；如果已经更新过，就先点一次“保存云端”。</div>`;
        return;
      }
      el.historyList.innerHTML = history.map((entry) => `
        <div class="history-row">
          <div class="history-version">v${escapeHtml(entry.version || "-")}</div>
          <div class="history-main">
            <div class="history-project" title="${escapeAttr(entry.projectName || "")}">${escapeHtml(entry.projectName || "未命名项目")}</div>
            <div class="history-meta">保存人：${escapeHtml(entry.updatedBy || "未填写")}</div>
            <div class="history-meta">时间：${escapeHtml(formatDateTime(entry.updatedAt))}</div>
          </div>
          <div class="history-size">${escapeHtml(formatBytes(entry.bytes))}</div>
        </div>
      `).join("");
    }

    async function cloudRequest(method, payload, suffix = "") {
      const response = await fetch(`${cloudUrl()}${suffix}`, {
        method,
        headers: {
          "Content-Type": "application/json",
          "X-Sync-Secret": cloudConfig.secret
        },
        body: payload ? JSON.stringify(payload) : undefined
      });
      const text = await response.text();
      if (!response.ok) {
        throw new Error(cloudErrorMessage(response.status, text));
      }
      return text ? JSON.parse(text) : {};
    }

    async function getCloudMeta() {
      try {
        return await cloudRequest("GET", null, "?meta=1");
      } catch (error) {
        if (!error.message.includes("云端还没有这份数据")) throw error;
      }

      try {
        const payload = await cloudRequest("GET");
        return {
          updatedAt: payload.savedAt || payload.updatedAt || payload.data?._cloud?.savedAt || "",
          updatedBy: payload.updatedBy || payload.data?._cloud?.savedBy || "旧版本保存",
          projectName: payload.projectName || payload.data?.projectName || payload.data?.products?.[0]?.projectName || ""
        };
      } catch (error) {
        if (error.message.includes("云端还没有这份数据")) return null;
        throw error;
      }
    }

    function hasNewerRemote(meta) {
      if (!meta?.updatedAt) return false;
      if (!localSavedAt) return true;
      return Date.parse(meta.updatedAt) > Date.parse(localSavedAt);
    }

    function formatDateTime(value) {
      if (!value) return "未知";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString("zh-CN", { hour12: false });
    }

    function cloudErrorMessage(status, text) {
      try {
        const body = JSON.parse(text || "{}");
        if (body.error === "unauthorized") return "同步密钥不匹配。请检查云端设置里的“同步密钥”是否等于 Cloudflare Worker 的 SYNC_SECRET。";
        if (body.error === "not found") return "云端还没有这份数据。请先点“保存云端”。";
        if (body.error === "history not available") return "当前 Worker 还没更新历史记录接口。请把新的 cloudflare-worker.js 部署到 Cloudflare。";
        if (body.error === "KV binding COST_DATA is missing") return "Worker 还没有绑定 KV，变量名必须是 COST_DATA。";
        if (body.error === "Worker secret SYNC_SECRET is missing") return "Worker 还没有设置 Secret，变量名必须是 SYNC_SECRET。";
        if (body.error) return body.error;
      } catch {}
      return text || `HTTP ${status}`;
    }

    async function copyJson() {
      await navigator.clipboard.writeText(el.jsonText.value);
    }

    function applyJson() {
      try {
        store = normalizeStore(JSON.parse(el.jsonText.value));
        data = activeProduct();
        localSavedAt = store._cloud?.savedAt || "";
        save();

    }

        ["管理口径首发项目利润率%", totals.firstLaunchProjectProfitMargin],
        [],
        ["成本范围代码", "成本范围", "大类", "子类", "物料", "位号", "规格", "单台用量", "单位", "损耗率%", "选中供应商", "料号/SKU", "型号", "计价方式", "单价/批次价", "运费/台", "加工费/台", "单位成本计入额", "批次成本计入额", "备注"]
      ];

    function csvCell(value) {
      const text = String(value ?? "");
      return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function downloadFile(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function calculateTotals(sourceData = data) {
      const totals = {
        batchQuantity: Math.max(1, number(sourceData.batchQty || 1)),
        unitPreDeliveryFulfillmentCost: 0,
        unitPostSaleSupportExpectedCost: 0,
        unitFulfillmentCost: 0,
        batchPreDeliveryFulfillmentCost: 0,
        batchFulfillmentCost: 0,
        fixedLaunchInvestment: 0,
        unitAllocatedFixedLaunchInvestment: 0,
        unitFirstLaunchFullCost: 0,
        firstLaunchProjectFullCost: 0,
        minimumAverageSellingPrice: 0,
        recommendedRetailUnitPrice: 0,
        targetFirstLaunchProjectProfitMarginRate: 0,
        salesChannelDeductionRate: 0,
        retainedCostCoverageRate: 0,
        grossPledgeRevenue: 0,
        salesChannelDeductions: 0,
        netSalesRevenue: 0,
        managementProductGrossProfit: 0,
        productContributionProfit: 0,
        firstLaunchProjectProfit: 0,
        allocatedFirstLaunchProjectProfitPerUnit: 0,
        firstLaunchProjectProfitMargin: 0,
        firstLaunchProjectProfitMarginRate: 0,
        itemCount: 0,
        missingSupplier: 0,
        byName: {},
        byId: {}
      };
      sourceData.categories.forEach((cat) => {
        const total = categoryTotal(cat, sourceData);
        const scope = normalizeCostScope(cat.costScope);
        if (scope === COST_SCOPE_POST_SALE_SUPPORT) {
          totals.unitPostSaleSupportExpectedCost += total;
        } else {
          totals.unitPreDeliveryFulfillmentCost += total;
        }
        totals.byName[cat.name] = total;
        totals.byId[cat.id] = total;
        cat.groups.forEach((grp) => grp.items.forEach((it) => {
          totals.itemCount += 1;
          if (!getChosenSupplier(it)) totals.missingSupplier += 1;
        }));
      });
      totals.unitFulfillmentCost = totals.unitPreDeliveryFulfillmentCost + totals.unitPostSaleSupportExpectedCost;
      totals.batchPreDeliveryFulfillmentCost = totals.unitPreDeliveryFulfillmentCost * totals.batchQuantity;
      totals.batchFulfillmentCost = totals.unitFulfillmentCost * totals.batchQuantity;
      totals.fixedLaunchInvestment = Math.max(0, number(sourceData.fixedLaunchCost));
      totals.unitAllocatedFixedLaunchInvestment = totals.fixedLaunchInvestment / totals.batchQuantity;
      totals.unitFirstLaunchFullCost = totals.unitFulfillmentCost + totals.unitAllocatedFixedLaunchInvestment;
      totals.firstLaunchProjectFullCost = totals.batchFulfillmentCost + totals.fixedLaunchInvestment;
      const targetProjectProfitMargin = sourceData.targetFirstLaunchProjectProfitMargin
        ?? sourceData.compatibilityAliases?.targetNetMargin
        ?? sourceData.targetNetMargin
        ?? sourceData.targetMargin;
      totals.targetFirstLaunchProjectProfitMarginRate = Math.min(60, Math.max(0, number(targetProjectProfitMargin))) / 100;
      totals.salesChannelDeductionRate = Math.min(30, Math.max(0, number(sourceData.salesFeeRate))) / 100;
      totals.retainedCostCoverageRate = 1 - totals.targetFirstLaunchProjectProfitMarginRate - totals.salesChannelDeductionRate;
      totals.minimumAverageSellingPrice = totals.retainedCostCoverageRate > 0
        ? totals.unitFirstLaunchFullCost / totals.retainedCostCoverageRate
        : 0;
      totals.recommendedRetailUnitPrice = roundRetailPrice(totals.minimumAverageSellingPrice);
      totals.grossPledgeRevenue = totals.recommendedRetailUnitPrice * totals.batchQuantity;
      totals.salesChannelDeductions = totals.grossPledgeRevenue * totals.salesChannelDeductionRate;
      totals.netSalesRevenue = totals.grossPledgeRevenue - totals.salesChannelDeductions;
      totals.managementProductGrossProfit = totals.grossPledgeRevenue - totals.batchFulfillmentCost;
      totals.productContributionProfit = totals.managementProductGrossProfit - totals.salesChannelDeductions;
      totals.firstLaunchProjectProfit = totals.productContributionProfit - totals.fixedLaunchInvestment;
      totals.allocatedFirstLaunchProjectProfitPerUnit = totals.firstLaunchProjectProfit / totals.batchQuantity;
      totals.firstLaunchProjectProfitMargin = totals.grossPledgeRevenue > 0
        ? totals.firstLaunchProjectProfit / totals.grossPledgeRevenue * 100
        : 0;
      totals.firstLaunchProjectProfitMarginRate = totals.firstLaunchProjectProfitMargin / 100;

      return totals;
    }

    function buildFinancialSummary(totals, sourceData = data) {
      return {
        schemaVersion: 2,
        terminologyVersion: FINANCIAL_TERMINOLOGY_VERSION,
        currency: sourceData.currency || "",
        batchQuantity: totals.batchQuantity,
        targetFirstLaunchProjectProfitMarginRate: totals.targetFirstLaunchProjectProfitMarginRate,
        salesChannelDeductionRate: totals.salesChannelDeductionRate,
        retainedCostCoverageRate: totals.retainedCostCoverageRate,
        unitPreDeliveryFulfillmentCost: totals.unitPreDeliveryFulfillmentCost,
        unitPostSaleSupportExpectedCost: totals.unitPostSaleSupportExpectedCost,
        unitFulfillmentCost: totals.unitFulfillmentCost,
        batchPreDeliveryFulfillmentCost: totals.batchPreDeliveryFulfillmentCost,
        batchFulfillmentCost: totals.batchFulfillmentCost,
        fixedLaunchInvestment: totals.fixedLaunchInvestment,
        unitAllocatedFixedLaunchInvestment: totals.unitAllocatedFixedLaunchInvestment,
        unitFirstLaunchFullCost: totals.unitFirstLaunchFullCost,
        firstLaunchProjectFullCost: totals.firstLaunchProjectFullCost,
        minimumAverageSellingPrice: totals.minimumAverageSellingPrice,
        recommendedRetailUnitPrice: totals.recommendedRetailUnitPrice,
        grossPledgeRevenue: totals.grossPledgeRevenue,
        salesChannelDeductions: totals.salesChannelDeductions,
        netSalesRevenue: totals.netSalesRevenue,
        managementProductGrossProfit: totals.managementProductGrossProfit,
        productContributionProfit: totals.productContributionProfit,
        firstLaunchProjectProfit: totals.firstLaunchProjectProfit,
        firstLaunchProjectProfitMarginRate: totals.firstLaunchProjectProfitMarginRate
      };
    }

    function roundRetailPrice(value) {
      if (!Number.isFinite(value) || value <= 0) return 0;
      return Math.ceil((value + 1) / 10) * 10 - 1;
    }

    function categoryTotal(cat, sourceData = data) {
      return cat.groups.reduce((sum, grp) => sum + groupTotal(grp, sourceData), 0);
    }

    function groupTotal(grp, sourceData = data) {
      return grp.items.reduce((sum, it) => sum + itemUnitCost(it, sourceData), 0);
    }

    function itemUnitCost(it, sourceData = data) {
      const sp = getChosenSupplier(it);
      return (sp ? supplierUnitCost(it, sp, sourceData) : 0) + number(it.processCost);
    }

    function supplierUnitCost(it, sp, sourceData = data) {
      if (sp.pricingMode === "batch") {
        return number(sp.price) / Math.max(1, number(sourceData.batchQty || 1)) + number(sp.shipping);
      }
      const qty = number(it.qty);
      const loss = 1 + number(it.lossRate) / 100;
      return qty * loss * number(sp.price) + number(sp.shipping);
    }

    function getChosenSupplier(it) {
      if (!it.chosenSupplierId) return null;
      return it.suppliers.find((sp) => sp.id === it.chosenSupplierId) || null;
    }

    function sumKeys(map, keys) {
      return keys.reduce((sum, key) => sum + number(map[key]), 0);
    }

    function itemCount(cat) {
      return cat.groups.reduce((sum, grp) => sum + grp.items.length, 0);
    }

    function walkItems(root, callback) {
      root.categories?.forEach((cat) => cat.groups?.forEach((grp) => grp.items?.forEach(callback)));
    }

    function matchesCategory(cat) {
      return [cat.name, cat.note, cat.costScope, costScopeLabel(cat.costScope)]
        .some((value) => String(value || "").toLowerCase().includes(filterText));
    }

    function matchesGroup(grp) {
      return [grp.name, grp.note].some((value) => String(value || "").toLowerCase().includes(filterText));
    }

    function matchesItem(it) {
      const supplierText = it.suppliers.map((sp) => [sp.name, sp.sku, sp.model, sp.note].join(" ")).join(" ");
      return [it.name, it.designator, it.footprint, it.note, supplierText].some((value) => String(value || "").toLowerCase().includes(filterText));
    }

    function findCategory(catId) {
      return data.categories.find((cat) => cat.id === catId);
    }

    function findGroup(catId, grpId) {
      return findCategory(catId).groups.find((grp) => grp.id === grpId);
    }

    function findItem(catId, grpId, itemId) {
      return findGroup(catId, grpId).items.find((it) => it.id === itemId);
    }

    function findSupplier(catId, grpId, itemId, supplierId) {
      return findItem(catId, grpId, itemId).suppliers.find((sp) => sp.id === supplierId);
    }

    function number(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }

    function normalizeCostScope(value, fallback = COST_SCOPE_PRE_DELIVERY_CASH) {
      if (value === COST_SCOPE_PRE_DELIVERY_CASH || value === COST_SCOPE_POST_SALE_SUPPORT) return value;
      return fallback;
    }

    function costScopeLabel(value) {
      return normalizeCostScope(value) === COST_SCOPE_POST_SALE_SUPPORT
        ? "售后支持预计成本"
        : "交付前履约成本";
    }

    function formatNum(value) {
      return new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 4 }).format(number(value));
    }

    function formatBytes(value) {
      const bytes = number(value);
      if (!bytes) return "-";
      if (bytes < 1024) return `${bytes} B`;
      return `${formatNum(bytes / 1024)} KB`;
    }

    function percent(value) {
      return `${formatNum(value)}%`;
    }

    function money(value) {
      return `${data.currency || "¥"}${new Intl.NumberFormat("zh-CN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 4
      }).format(number(value))}`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }
  </script>
</body>
</html>
