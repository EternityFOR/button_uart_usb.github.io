              it.designator,
              it.footprint,
              it.qty,
              it.unit,
              it.lossRate,
              sp.name || "",
              sp.sku || "",
              sp.model || "",
              sp.id ? (sp.pricingMode === "batch" ? "批次分摊" : "单台单价") : "",
              sp.price || 0,
              sp.shipping || 0,
              it.processCost || 0,
              unit,
              unit * number(data.batchQty || 1),
              it.note || "",
              reference.budgetId || (reference.referenceKind === "model-boundary" ? it.id : ""),
              reference.status ? budgetStatusLabel(reference.status) : "",
              reference.budgetId ? budgetEstimateLabel(reference) : "",
              isChannelDeductionScope(cat.costScope)
                ? `${formatFixed(channelItemRatePercent(cat, it), 2)}% 产品收入扣减`
                : reference.relationship
                  ? budgetRelationshipLabel(reference.relationship)
                  : ""
            ]);
          });
        });
      });
      downloadFile(`${data.projectName || "cost"}-成本表.csv`, "\ufeff" + rows.map((row) => row.map(csvCell).join(",")).join("\n"), "text/csv;charset=utf-8");
    }

    function csvCell(value) {
      const text = String(value ?? "");
      return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function downloadFile(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function calculateTotals(sourceData = data) {
      const totals = {
        batchQuantity: Math.max(1, number(sourceData.batchQty || 1)),
        unitPreDeliveryFulfillmentCost: 0,
        unitPostSaleSupportExpectedCost: 0,
        unitFulfillmentCost: 0,
        batchPreDeliveryFulfillmentCost: 0,
        batchFulfillmentCost: 0,
        fixedLaunchInvestment: 0,
        unitAllocatedFixedLaunchInvestment: 0,
        unitFirstLaunchFullCost: 0,
        firstLaunchProjectFullCost: 0,
        minimumAverageSellingPrice: 0,
        recommendedRetailUnitPrice: 0,
        targetFirstLaunchProjectProfitMarginRate: 0,
        salesChannelDeductionRate: 0,
        retainedCostCoverageRate: 0,
        grossPledgeRevenue: 0,
        salesChannelDeductions: 0,
        netSalesRevenue: 0,
        managementProductGrossProfit: 0,
        productContributionProfit: 0,
        firstLaunchProjectProfit: 0,
        allocatedFirstLaunchProjectProfitPerUnit: 0,
        firstLaunchProjectProfitMargin: 0,
        firstLaunchProjectProfitMarginRate: 0,
        itemCount: 0,
        missingSupplier: 0,
        byName: {},
        byId: {}
      };
      sourceData.categories.forEach((cat) => {
        const total = categoryTotal(cat, sourceData);
        const scope = normalizeCostScope(cat.costScope);
        if (scope === COST_SCOPE_FIXED_LAUNCH) {
          // Fixed-launch categories are batch-level details and do not enter unit fulfillment cost.
        } else if (scope === COST_SCOPE_POST_SALE_SUPPORT) {
          totals.unitPostSaleSupportExpectedCost += total;
        } else if (scope === COST_SCOPE_PRE_DELIVERY_CASH) {
          totals.unitPreDeliveryFulfillmentCost += total;
        }
        totals.byName[cat.name] = categoryDisplayAmount(cat, sourceData);
        totals.byId[cat.id] = categoryDisplayAmount(cat, sourceData);
        cat.groups.forEach((grp) => grp.items.forEach((it) => {
          if (isReferenceScope(scope)) return;
          totals.itemCount += 1;
          if (!getChosenSupplier(it)) totals.missingSupplier += 1;
        }));
      });
      totals.unitFulfillmentCost = totals.unitPreDeliveryFulfillmentCost + totals.unitPostSaleSupportExpectedCost;
      totals.batchPreDeliveryFulfillmentCost = totals.unitPreDeliveryFulfillmentCost * totals.batchQuantity;
      totals.batchFulfillmentCost = totals.unitFulfillmentCost * totals.batchQuantity;
      totals.fixedLaunchInvestment = hasFixedLaunchDetails(sourceData)
        ? fixedLaunchDetailTotal(sourceData)
        : Math.max(0, number(sourceData.fixedLaunchCost));
      totals.unitAllocatedFixedLaunchInvestment = totals.fixedLaunchInvestment / totals.batchQuantity;
      totals.unitFirstLaunchFullCost = totals.unitFulfillmentCost + totals.unitAllocatedFixedLaunchInvestment;
      totals.firstLaunchProjectFullCost = totals.batchFulfillmentCost + totals.fixedLaunchInvestment;
      const targetProjectProfitMargin = sourceData.targetFirstLaunchProjectProfitMargin
        ?? sourceData.compatibilityAliases?.targetNetMargin
        ?? sourceData.targetNetMargin
        ?? sourceData.targetMargin;
      totals.targetFirstLaunchProjectProfitMarginRate = Math.min(60, Math.max(0, number(targetProjectProfitMargin))) / 100;
      totals.salesChannelDeductionRate = Math.min(30, Math.max(0, number(sourceData.salesFeeRate))) / 100;
      totals.retainedCostCoverageRate = 1 - totals.targetFirstLaunchProjectProfitMarginRate - totals.salesChannelDeductionRate;
      totals.minimumAverageSellingPrice = totals.retainedCostCoverageRate > 0
        ? totals.unitFirstLaunchFullCost / totals.retainedCostCoverageRate
        : 0;
      totals.recommendedRetailUnitPrice = roundRetailPrice(totals.minimumAverageSellingPrice);
      totals.grossPledgeRevenue = totals.recommendedRetailUnitPrice * totals.batchQuantity;
      totals.salesChannelDeductions = totals.grossPledgeRevenue * totals.salesChannelDeductionRate;
      totals.netSalesRevenue = totals.grossPledgeRevenue - totals.salesChannelDeductions;
      totals.managementProductGrossProfit = totals.grossPledgeRevenue - totals.batchFulfillmentCost;
      totals.productContributionProfit = totals.managementProductGrossProfit - totals.salesChannelDeductions;
      totals.firstLaunchProjectProfit = totals.productContributionProfit - totals.fixedLaunchInvestment;
      totals.allocatedFirstLaunchProjectProfitPerUnit = totals.firstLaunchProjectProfit / totals.batchQuantity;
      totals.firstLaunchProjectProfitMargin = totals.grossPledgeRevenue > 0
        ? totals.firstLaunchProjectProfit / totals.grossPledgeRevenue * 100
        : 0;
      totals.firstLaunchProjectProfitMarginRate = totals.firstLaunchProjectProfitMargin / 100;

      return totals;
    }

    function buildFinancialSummary(totals, sourceData = data) {
      return {
        schemaVersion: 2,
        terminologyVersion: FINANCIAL_TERMINOLOGY_VERSION,
        currency: sourceData.currency || "",
        batchQuantity: totals.batchQuantity,
        targetFirstLaunchProjectProfitMarginRate: totals.targetFirstLaunchProjectProfitMarginRate,
        salesChannelDeductionRate: totals.salesChannelDeductionRate,
        retainedCostCoverageRate: totals.retainedCostCoverageRate,
        unitPreDeliveryFulfillmentCost: totals.unitPreDeliveryFulfillmentCost,
        unitPostSaleSupportExpectedCost: totals.unitPostSaleSupportExpectedCost,
        unitFulfillmentCost: totals.unitFulfillmentCost,
        batchPreDeliveryFulfillmentCost: totals.batchPreDeliveryFulfillmentCost,
        batchFulfillmentCost: totals.batchFulfillmentCost,
        fixedLaunchInvestment: totals.fixedLaunchInvestment,
        unitAllocatedFixedLaunchInvestment: totals.unitAllocatedFixedLaunchInvestment,
        unitFirstLaunchFullCost: totals.unitFirstLaunchFullCost,
        firstLaunchProjectFullCost: totals.firstLaunchProjectFullCost,
        minimumAverageSellingPrice: totals.minimumAverageSellingPrice,
        recommendedRetailUnitPrice: totals.recommendedRetailUnitPrice,
        grossPledgeRevenue: totals.grossPledgeRevenue,
        salesChannelDeductions: totals.salesChannelDeductions,
        netSalesRevenue: totals.netSalesRevenue,
        managementProductGrossProfit: totals.managementProductGrossProfit,
        productContributionProfit: totals.productContributionProfit,
        firstLaunchProjectProfit: totals.firstLaunchProjectProfit,
        firstLaunchProjectProfitMarginRate: totals.firstLaunchProjectProfitMarginRate
      };
    }

    function roundRetailPrice(value) {
      if (!Number.isFinite(value) || value <= 0) return 0;
      return Math.ceil((value + 1) / 10) * 10 - 1;
    }

    function isFixedLaunchScope(value) {
      return normalizeCostScope(value) === COST_SCOPE_FIXED_LAUNCH;
    }

    function isChannelDeductionScope(value) {
      return normalizeCostScope(value) === COST_SCOPE_CHANNEL_DEDUCTION;
    }

    function isBudgetContextScope(value) {
      return normalizeCostScope(value) === COST_SCOPE_BUDGET_CONTEXT;
    }

    function isReferenceScope(value) {
      return isChannelDeductionScope(value) || isBudgetContextScope(value);
    }

    function hasFixedLaunchDetails(sourceData = data) {
      return sourceData.categories.some((cat) => isFixedLaunchScope(cat.costScope));
    }

    function fixedLaunchDetailTotal(sourceData = data) {
      const batchQuantity = Math.max(1, number(sourceData.batchQty || 1));
      return sourceData.categories
        .filter((cat) => isFixedLaunchScope(cat.costScope))
        .reduce((sum, cat) => sum + categoryTotal(cat, sourceData) * batchQuantity, 0);
    }

    function syncFixedLaunchCost(sourceData = data) {
      if (!hasFixedLaunchDetails(sourceData)) return;
      sourceData.fixedLaunchCost = Math.round(fixedLaunchDetailTotal(sourceData) * 10000) / 10000;
    }

    function categoryDisplayAmount(cat, sourceData = data) {
      if (isReferenceScope(cat.costScope)) return 0;
      const amount = categoryTotal(cat, sourceData);
      return isFixedLaunchScope(cat.costScope)
        ? amount * Math.max(1, number(sourceData.batchQty || 1))
        : amount;
    }

    function groupDisplayAmount(cat, grp, sourceData = data) {
      if (isReferenceScope(cat.costScope)) return 0;
      const amount = groupTotal(grp, sourceData);
      return isFixedLaunchScope(cat.costScope)
        ? amount * Math.max(1, number(sourceData.batchQty || 1))
        : amount;
    }

    function categoryDisplayLabel(cat, sourceData = data) {
      if (isChannelDeductionScope(cat.costScope)) return `${formatFixed(channelDeductionRatePercent(sourceData), 2)}%`;
      if (isBudgetContextScope(cat.costScope)) return `${itemCount(cat)} 项 · 当前不计入`;
      return money(categoryDisplayAmount(cat, sourceData));
    }

    function categorySummaryLabel(cat, totals, sourceData = data) {
      if (isChannelDeductionScope(cat.costScope)) return `${formatFixed(totals.salesChannelDeductionRate * 100, 2)}%`;
      if (isBudgetContextScope(cat.costScope)) return `${itemCount(cat)} 项 · 不计入`;
      return money(totals.byId[cat.id] || 0);
    }

    function groupDisplayLabel(cat, grp, sourceData = data) {
      if (isChannelDeductionScope(cat.costScope)) {
        const total = grp.items.reduce((sum, item) => sum + channelItemRatePercent(cat, item, sourceData), 0);
        return `${formatFixed(total, 2)}%`;
      }
      if (isBudgetContextScope(cat.costScope)) return `${grp.items.length} 项`;
      return money(groupDisplayAmount(cat, grp, sourceData));
    }

    function itemDisplayAmount(cat, it, sourceData = data) {
      const amount = itemUnitCost(it, sourceData);
      return isFixedLaunchScope(cat.costScope)
        ? amount * Math.max(1, number(sourceData.batchQty || 1))
        : amount;
    }

    function supplierDisplayAmount(cat, it, sp, sourceData = data) {
      const amount = supplierUnitCost(it, sp, sourceData);
      return isFixedLaunchScope(cat.costScope)
        ? amount * Math.max(1, number(sourceData.batchQty || 1))
        : amount;
    }

    function categoryTotal(cat, sourceData = data) {
      if (isReferenceScope(cat.costScope)) return 0;
      return cat.groups.reduce((sum, grp) => sum + groupTotal(grp, sourceData), 0);
    }

    function channelDeductionRatePercent(sourceData = data) {
      return Math.min(30, Math.max(0, number(sourceData.salesFeeRate)));
    }

    function channelItemRatePercent(cat, item, sourceData = data) {
      const total = channelDeductionRatePercent(sourceData);
      if (item.rateMode === "fixed") return Math.min(total, Math.max(0, number(item.ratePercent)));
      const fixedTotal = cat.groups
        .flatMap((group) => group.items)
        .filter((candidate) => candidate.rateMode === "fixed")
        .reduce((sum, candidate) => sum + Math.max(0, number(candidate.ratePercent)), 0);
      return Math.max(0, total - Math.min(total, fixedTotal));
    }

    function budgetItemLabel(budgetId, fallback) {
      return ({
        "BUD-0001": "Inno Setup 商业使用许可（无需购买）",
        "BUD-0003": "Azure Trusted Signing Basic 资格路线",
        "BUD-0004": "美国首次申请回退路线官方费",
        "BUD-0005": "非香港专利延续与海外扩展预留",
        "BUD-0006": "香港专利审查阶段律师撰写与复核预留",
        "BUD-0007": "香港短期专利官方申请费（条件路线）",
        "BUD-0008": "香港标准专利（O）OP1 申请及公告费（已支付）",
        "BUD-0009": "中国内地专利后续路线预留",
        "BUD-0013": "香港注册地址与公司秘书服务",
        "BUD-0014": "DeDge 文字商标香港官方申请费（已支付）",
        "BUD-0015": "主 .com 域名注册与首次续费基线",
        "BUD-0017": "验证样机与寄送（已由 V5 工程批次覆盖）",
        "BUD-0018": "台架测试夹具、适配器、备用目标板与耗材",
        "BUD-0019": "首批 300 台交付前生产现金需求（已进入当前模型）",
        "BUD-0020": "三人核心团队月度薪酬基线",
        "BUD-0021": "香港本地私人公司注册费",
        "BUD-0022": "首份商业登记证费用及征费",
        "BUD-0023": "周年申报表 NAR1 按时提交费",
        "BUD-0024": "商业登记续期费用及征费",
        "BUD-0025": "记账、年度账目与审计服务基线",
        "BUD-0027": "Kickstarter 页面素材与短演示制作",
        "BUD-0028": "众筹回报包装、插页、标签与首波打包材料",
        "BUD-0029": "众筹出库运费转付",
        "BUD-0030": "Kickstarter 平台费扣减",
        "BUD-0031": "支付处理费扣减",
        "BUD-0032": "补发、退款、丢件与支持预计成本（已进入当前模型）",
        "BUD-0033": "启动演示、媒体与评测用 Proof 设备",
        "BUD-0034": "香港标准专利（O）OP2 实质审查费",
        "BUD-0035": "FlashLink 文字商标香港官方申请费",
        "BUD-0036": "DeDge 核心设备图形商标香港官方申请费",
        "BUD-0037": "dedge.dev 首年域名注册费",
        "BUD-0038": "香港邮政个人 e-Cert（IPD 电子提交）",
        "BUD-0039": "第三方 OEM 虚拟串口驱动 SDK 备选报价",
        "BUD-0040": "欧盟 / 英国网络安全与产品安全扩展预留",
        "BUD-0041": "NRTL 列名增量预留",
        "BUD-0042": "美国完整有意辐射体重认证与 TCB 条件路线"
      })[String(budgetId || "")] || String(fallback || budgetId || "未命名预算项");
    }

    function budgetEstimateLabel(reference = {}) {
      if (reference.referenceKind === "model-boundary") return "尚未计量";
      const currency = String(reference.currency || "").trim() || "原币";
      const low = number(reference.lowEstimate);
      const high = number(reference.highEstimate);
      const format = (value) => new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 2 }).format(value);
      if (low === high) return `${currency} ${format(low)}`;
      return `${currency} ${format(low)} - ${format(high)}`;
    }

    function budgetStatusLabel(status) {
      return ({
        closed: "已关闭 / 无费用",
        covered: "已由其他预算覆盖",
        "included-in-manufacturing": "已计入生产成本",
        "included-in-unit-cost": "已计入单位成本",
        "shipping-pass-through": "客户运费转付",
        "revenue-deduction": "从产品收入扣减",
        paid: "已支付",
        "receipt-needed": "待补付款凭证",
        deferred: "递延",
        "eligibility-check": "资格核查",
        "quote-needed": "待报价",
        unquoted: "尚未报价",
        "statutory-adjustment": "法定调整后确认",
        open: "当前预算",
        active: "当前有效",
        planned: "已计划"
      })[String(status || "")] || String(status || "未标注");
    }

    function budgetRelationshipLabel(relationship) {
      return ({
        "covered-or-included": "不重复计入",
        "included-in-current-model": "已进入当前成本公式",
        "shipping-pass-through": "客户另付",
        "conditional-or-deferred": "条件触发后再计入",
        "paid-or-shared": "不计入本次新增成本",
        "paid-or-personal-prerequisite": "已支付或个人前置，不回加",
        "later-ip-route": "后续法定或策略路线",
        "alternative-ip-route": "替代路线，触发后再计入",
        "company-level-not-allocated": "主体层费用，当前不分摊",
        "unpriced-model-boundary": "金额确认后回模型重算",
        "statutory-model-boundary": "法定调整，不计入项目管理利润"
      })[String(relationship || "")] || "当前不计入";
    }

    function groupTotal(grp, sourceData = data) {
      return grp.items.reduce((sum, it) => sum + itemUnitCost(it, sourceData), 0);
    }

    function itemUnitCost(it, sourceData = data) {
      const sp = getChosenSupplier(it);
      return (sp ? supplierUnitCost(it, sp, sourceData) : 0) + number(it.processCost);
    }

    function supplierUnitCost(it, sp, sourceData = data) {
      if (sp.pricingMode === "batch") {
        return number(sp.price) / Math.max(1, number(sourceData.batchQty || 1)) + number(sp.shipping);
      }
      const qty = number(it.qty);
      const loss = 1 + number(it.lossRate) / 100;
      return qty * loss * number(sp.price) + number(sp.shipping);
    }

    function getChosenSupplier(it) {
      if (!it.chosenSupplierId) return null;
      return it.suppliers.find((sp) => sp.id === it.chosenSupplierId) || null;
    }

    function sumKeys(map, keys) {
      return keys.reduce((sum, key) => sum + number(map[key]), 0);
    }

    function itemCount(cat) {
      return cat.groups.reduce((sum, grp) => sum + grp.items.length, 0);
    }

    function walkItems(root, callback) {
      root.categories?.forEach((cat) => cat.groups?.forEach((grp) => grp.items?.forEach(callback)));
    }

    function matchesCategory(cat) {
      return [cat.name, cat.note, cat.costScope, costScopeLabel(cat.costScope)]
        .some((value) => String(value || "").toLowerCase().includes(filterText));
    }

    function matchesGroup(grp) {
      return [grp.name, grp.note].some((value) => String(value || "").toLowerCase().includes(filterText));
    }

    function matchesItem(it) {
      const supplierText = it.suppliers.map((sp) => [sp.name, sp.sku, sp.model, sp.note].join(" ")).join(" ");
      const reference = it.budgetReference || {};
      const referenceText = [
        reference.budgetId,
        reference.projectId,
        reference.category,
        reference.status,
        reference.currency,
        reference.dueStage,
        reference.sourceOrBasis,
        reference.notes
      ].join(" ");
      return [it.name, it.designator, it.footprint, it.note, supplierText, referenceText]
        .some((value) => String(value || "").toLowerCase().includes(filterText));
    }

    function findCategory(catId) {
      return data.categories.find((cat) => cat.id === catId);
    }

    function findGroup(catId, grpId) {
      return findCategory(catId).groups.find((grp) => grp.id === grpId);
    }

    function findItem(catId, grpId, itemId) {
      return findGroup(catId, grpId).items.find((it) => it.id === itemId);
    }

    function findSupplier(catId, grpId, itemId, supplierId) {
      return findItem(catId, grpId, itemId).suppliers.find((sp) => sp.id === supplierId);
    }

    function number(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }

    function normalizeCostScope(value, fallback = COST_SCOPE_PRE_DELIVERY_CASH) {
      if (
        value === COST_SCOPE_PRE_DELIVERY_CASH
        || value === COST_SCOPE_POST_SALE_SUPPORT
        || value === COST_SCOPE_FIXED_LAUNCH
        || value === COST_SCOPE_CHANNEL_DEDUCTION
        || value === COST_SCOPE_BUDGET_CONTEXT
      ) return value;
      return fallback;
    }

    function costScopeLabel(value) {
      const scope = normalizeCostScope(value);
      if (scope === COST_SCOPE_FIXED_LAUNCH) return "首发固定投入";
      if (scope === COST_SCOPE_POST_SALE_SUPPORT) return "售后支持预计成本";
      if (scope === COST_SCOPE_CHANNEL_DEDUCTION) return "按产品收入扣减";
      if (scope === COST_SCOPE_BUDGET_CONTEXT) return "预算边界 / 当前不计入";
      return "交付前履约成本";
    }

    function formatNum(value) {
      return new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 4 }).format(number(value));
    }

    function formatFixed(value, digits = 4) {
      return new Intl.NumberFormat("zh-CN", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      }).format(number(value));
    }

    function formatBytes(value) {
      const bytes = number(value);
      if (!bytes) return "-";
      if (bytes < 1024) return `${bytes} B`;
      return `${formatNum(bytes / 1024)} KB`;
    }

    function percent(value) {
      return `${formatNum(value)}%`;
    }

    function money(value) {
      return `${currencyCode(data.currency)} ${new Intl.NumberFormat("zh-CN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 4
      }).format(number(value))}`;
    }

    function currencyCode(value) {
      const currency = String(value || "").trim().toUpperCase();
      if (currency === "HK$" || currency === "HKD") return "HKD";
      if (currency === "¥" || currency === "CNY" || currency === "RMB") return "CNY";
      if (currency === "$" || currency === "USD") return "USD";
      return currency || "CNY";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }
  </script>
